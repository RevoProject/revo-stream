[package]
name = "revo-gpui"
version = "0.5.0.1"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
gpui = "=0.2.2"
revo-core = { path = "../revo-core" }
base64 = { version = "0.22", optional = true }
# Preview frames arrive as raw RGBA and are uploaded as `RenderImage` frames,
# which are `image::Frame` buffers. Same `image` version gpui itself uses, so
# this adds no new crate to the build.
image = { version = "0.25", default-features = false }
# Typed auxiliary-window state (debug-console log details) is framework
# neutral and stays available in mock builds.
serde_json = "1"

[features]
# The obs feature selects the engine-backed `AnyBackend::Obs` handle and the
# PNG data-URI decoder used by browser interaction; the libobs runtime itself
# lives in the separate `revo-engine` process (crates/revo-backend), so the UI
# process carries no revo-backend dependency at all.
obs-backend = ["dep:base64"]

# xattr 0.2.3, pulled by GPUI's HTTP client, does not compile with libc 0.2.191.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
