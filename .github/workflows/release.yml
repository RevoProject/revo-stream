name: Release
on:
  push:
    tags: ["*.*.*", "v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_dev_release:
        description: "Publish dev release"
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-dispatch' || format('release-{0}', github.ref) }}
  cancel-in-progress: false
env:
  OBS_VERSION: 32.1.2
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The release artifacts are built from the native GPUI application
# (crates/revo-gpui UI process + crates/revo-backend engine process). No Tauri
# bundler, no frontend toolchain: every package family carries the same staged
# runtime layout described by scripts/linux/package-gpui.sh.
jobs:
  linux:
    name: "Linux x64 (GPUI: AppImage, DEB, RPM, portable)"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        name: Checkout
      - uses: dtolnay/rust-toolchain@stable
        name: Setup Rust
      - name: Install Linux build and packaging dependencies
        run: bash scripts/linux/install-dependencies.sh
      - name: Build matching OBS runtime
        run: bash scripts/linux/build-obs.sh
      - name: Stage OBS libraries, plugins and helper dependencies
        run: bash scripts/linux/prepare-runtime.sh "$RUNNER_TEMP/obs-install"
      - name: Disable unavailable sibling CEF dependency
        run: python3 scripts/release/disable-cef.py
      - name: Check the legacy Tauri adapter still builds
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build GPUI application
        run: cargo build --release --features obs-backend --manifest-path crates/revo-gpui/Cargo.toml
      - name: Build engine process
        run: cargo build --release --bin revo-engine --manifest-path crates/revo-backend/Cargo.toml
      - name: Stage the portable GPUI tree
        run: bash scripts/linux/package-gpui.sh
      - name: Build DEB, RPM and AppImage
        run: bash scripts/linux/package-gpui-bundles.sh
      - name: Verify Linux GPUI release files and generate checksums
        run: bash scripts/linux/verify-gpui-release.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            crates/revo-gpui/target/release/bundle/*.AppImage
            crates/revo-gpui/target/release/bundle/*.deb
            crates/revo-gpui/target/release/bundle/*.rpm
            crates/revo-gpui/target/release/bundle/*-linux-x64-portable.tar.gz
            crates/revo-gpui/target/release/bundle/*-linux-x64.run
            crates/revo-gpui/target/release/bundle/*-linux-x64-SHA256SUMS.txt

  windows:
    name: "Windows x64 (GPUI: portable ZIP, NSIS, MSI)"
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        name: Checkout
      - uses: dtolnay/rust-toolchain@stable
        name: Setup Rust
        with:
          toolchain: stable
      - name: Install packaging tools (NSIS, WiX)
        run: choco install nsis wixtoolset -y --no-progress
      - name: Prepare revo-root
        run: ./scripts/windows/prepare-revo-root.ps1
      - name: Disable CEF for CI build
        shell: bash
        run: python3 scripts/release/disable-cef.py
      - name: Fetch Rust dependencies
        shell: bash
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          cargo fetch --manifest-path crates/revo-backend/Cargo.toml
          cargo fetch --manifest-path crates/revo-gpui/Cargo.toml
      - name: Patch libobs-bootstrapper dummy DLL feature
        run: ./scripts/windows/patch-libobs-bootstrapper.ps1
      - name: Install cargo-obs-build
        run: cargo install cargo-obs-build --version 2.0.3 --locked
      - name: Bootstrap OBS
        working-directory: src-tauri
        run: cargo obs-build build --out-dir target/release --tag $env:OBS_VERSION
      - name: Verify Windows OBS runtime
        run: ./scripts/windows/verify-obs-runtime.ps1
      - name: Populate Windows revo-root
        run: ./scripts/windows/prepare-runtime.ps1
      - name: Verify Windows runtime
        run: ./scripts/windows/verify-runtime.ps1
      - name: Build GPUI application
        env:
          REVO_OBS_LIB_DIR: ${{ github.workspace }}\src-tauri\target\release
          LIBOBS_PATH: ${{ github.workspace }}\src-tauri\target\release
        run: cargo build --release --features obs-backend --manifest-path crates/revo-gpui/Cargo.toml
      - name: Build engine process
        env:
          REVO_OBS_LIB_DIR: ${{ github.workspace }}\src-tauri\target\release
          LIBOBS_PATH: ${{ github.workspace }}\src-tauri\target\release
        run: cargo build --release --bin revo-engine --manifest-path crates/revo-backend/Cargo.toml
      - name: Package GPUI (ZIP, NSIS, MSI)
        run: ./scripts/windows/package-gpui.ps1
      - name: Verify Windows GPUI packages
        run: ./scripts/windows/verify-gpui-package.ps1
      - name: Smoke test the packaged engine
        run: ./scripts/windows/smoke-test-gpui.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            crates/revo-gpui/target/release/bundle/*.zip
            crates/revo-gpui/target/release/bundle/*.exe
            crates/revo-gpui/target/release/bundle/*.msi

  macos:
    name: "macOS ${{ matrix.arch }} (GPUI: DMG)"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      REVO_TARGET: ${{ matrix.target }}
      REVO_ARCH: ${{ matrix.arch }}
      REVO_CMAKE_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}
      REVO_APP_BINARY: revo-gpui
      REVO_APP_EXTRA_BINARIES: revo-engine
      REVO_DMG_BASENAME: revo-gpui
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        name: Checkout
      - name: Create architecture-isolated directories
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/revo-macos-$REVO_TARGET"
          {
            echo "REVO_OBS_SRC=$ROOT/source/obs-studio"
            echo "REVO_OBS_BUILD=$ROOT/build/obs"
            echo "REVO_OBS_INSTALL=$ROOT/install/obs"
            echo "REVO_DIAGNOSTICS=$ROOT/diagnostics"
          } >> "$GITHUB_ENV"
          mkdir -p "$ROOT/source/obs-studio" "$ROOT/build/obs" "$ROOT/install/obs" "$ROOT/diagnostics/logs"
      - name: Record runner and toolchain provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "target=$REVO_TARGET"
            echo "expected_arch=$REVO_CMAKE_ARCH"
            echo "runner_arch=${{ runner.arch }}"
            echo "uname=$(uname -m)"
            sw_vers
            rustc -vV
            brew config
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
          } 2>&1 | tee "$REVO_DIAGNOSTICS/runner.txt"
          case "$REVO_CMAKE_ARCH:$(uname -m)" in
            arm64:arm64|x64:x86_64|x86_64:x86_64)
              echo "Runner architecture matches expected architecture."
              ;;
            *)
              echo "::error::Architecture mismatch: expected=$REVO_CMAKE_ARCH, uname=$(uname -m)"
              exit 1
              ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        name: Setup Rust target
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install host media dependency
        shell: bash
        run: |
          set -euo pipefail
          brew install mpg123 2>&1 | tee "$REVO_DIAGNOSTICS/logs/install-host-media.log"
          brew info --json=v2 mpg123 > "$REVO_DIAGNOSTICS/homebrew-formulae.json"
      - name: Prepare project sources
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/macos/install-simde.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/install-simde.log"
          bash scripts/macos/verify-simde.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/verify-simde.log"
          python3 scripts/macos/disable-obs-logger.py
          cargo fetch --manifest-path crates/revo-backend/Cargo.toml 2>&1 | tee "$REVO_DIAGNOSTICS/logs/cargo-fetch.log"
          python3 scripts/macos/patch-libobs-bindgen.py
          python3 scripts/macos/patch-libobs-wrapper.py
          bash scripts/macos/verify-libobs-patches.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/verify-libobs-patches.log"
      - name: Checkout and record OBS provenance
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/macos/checkout-obs.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/checkout-obs.log"
          {
            echo "repository=https://github.com/obsproject/obs-studio.git"
            echo "requested_ref=$OBS_VERSION"
            echo "commit=$(git -C "$REVO_OBS_SRC" rev-parse HEAD)"
            git -C "$REVO_OBS_SRC" submodule status --recursive
          } > "$REVO_DIAGNOSTICS/obs-provenance.txt"
      - name: Patch and configure OBS
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/macos/patch-obs-metal-swift.py
          python3 scripts/macos/patch-obs-virtualcam-warnings.py
          bash scripts/macos/verify-obs-source-patches.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/verify-obs-source-patches.log"
          bash scripts/macos/configure-obs.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/configure-obs.log"
          cp "$REVO_OBS_BUILD/CMakeCache.txt" "$REVO_DIAGNOSTICS/CMakeCache.txt"
          grep -Ei 'ffmpeg|avcodec|avformat|avutil|swresample|swscale|dependency' "$REVO_OBS_BUILD/CMakeCache.txt" > "$REVO_DIAGNOSTICS/cmake-ffmpeg-selection.txt" || true
          # CMake/runtime scripts use the project label "x64", while macOS tools
          # such as lipo report the actual CPU name "x86_64". Pass the canonical
          # CPU name to the provenance validator so it checks the architecture
          # reported by lipo instead of rejecting a valid universal binary.
          if [[ "$REVO_CMAKE_ARCH" == "x64" ]]; then
            REVO_CMAKE_ARCH=x86_64 bash scripts/macos/verify-obs-ffmpeg-provenance.sh "$REVO_DIAGNOSTICS" 2>&1 | tee "$REVO_DIAGNOSTICS/logs/verify-obs-ffmpeg-provenance.log"
          else
            bash scripts/macos/verify-obs-ffmpeg-provenance.sh "$REVO_DIAGNOSTICS" 2>&1 | tee "$REVO_DIAGNOSTICS/logs/verify-obs-ffmpeg-provenance.log"
          fi
      - name: Build and install OBS
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$REVO_OBS_BUILD" --config RelWithDebInfo --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee "$REVO_DIAGNOSTICS/logs/build-obs.log"
          bash scripts/macos/install-obs.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/install-obs.log"
          bash scripts/macos/configure-libobs-linker-path.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/configure-libobs-linker.log"
          bash scripts/macos/reject-windows-binaries.sh
      - name: Audit OBS build before staging
        shell: bash
        run: bash scripts/macos/audit-runtime-dependencies.sh "$REVO_OBS_BUILD" "$REVO_DIAGNOSTICS" obs-build 2>&1 | tee "$REVO_DIAGNOSTICS/logs/audit-obs-build.log"
      - name: Stage and audit runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/macos/populate-revo-root.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/populate-revo-root.log"
          bash scripts/macos/audit-runtime-dependencies.sh src-tauri/resources/revo-root "$REVO_DIAGNOSTICS" staged-before-ffmpeg 2>&1 | tee "$REVO_DIAGNOSTICS/logs/audit-before-ffmpeg.log"
          bash scripts/macos/bundle-ffmpeg-dependencies.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/bundle-ffmpeg.log"
          test -s "$REVO_DIAGNOSTICS/staged-obs-deps-provenance.tsv"
          bash scripts/macos/thin-runtime.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/thin-runtime.log"
          bash scripts/macos/normalize-runtime-rpaths.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/normalize-runtime.log"
          bash scripts/macos/verify-runtime.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/verify-runtime.log"
          bash scripts/macos/audit-runtime-dependencies.sh src-tauri/resources/revo-root "$REVO_DIAGNOSTICS" staged-final 2>&1 | tee "$REVO_DIAGNOSTICS/logs/audit-staged-final.log"
      - name: Build GPUI application
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "$REVO_TARGET" --features obs-backend \
            --manifest-path crates/revo-gpui/Cargo.toml 2>&1 | tee "$REVO_DIAGNOSTICS/logs/build-gpui.log"
      - name: Build engine process
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "$REVO_TARGET" --bin revo-engine \
            --manifest-path crates/revo-backend/Cargo.toml 2>&1 | tee "$REVO_DIAGNOSTICS/logs/build-engine.log"
      - name: Assemble the GPUI app bundle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/macos/package-gpui-app.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/package-app.log"
          bash scripts/macos/ensure-app-resources.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/ensure-app-resources.log"
          bash scripts/macos/normalize-app-dylib-paths.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/normalize-app.log"
          bash scripts/macos/codesign-app.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/codesign-app.log"
          bash scripts/macos/verify-app.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/verify-app.log"
          APP="$(find "src-tauri/target/$REVO_TARGET/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/macos/audit-runtime-dependencies.sh "$APP" "$REVO_DIAGNOSTICS" final-app 2>&1 | tee "$REVO_DIAGNOSTICS/logs/audit-final-app.log"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$REVO_DIAGNOSTICS/RevoStream-$REVO_TARGET.app.zip"
      - name: CI engine smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "src-tauri/target/$REVO_TARGET/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/macos/smoke-test-gpui.sh "$APP" 2>&1 | tee "$REVO_DIAGNOSTICS/logs/smoke-test-gpui.log"
      - name: Build and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/macos/build-dmg.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/build-dmg.log"
          bash scripts/macos/verify-dmg.sh 2>&1 | tee "$REVO_DIAGNOSTICS/logs/verify-dmg.log"
      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Write macOS diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "# macOS GPUI release build diagnostic"
            echo
            echo "- Target: $REVO_TARGET"
            echo "- Architecture: $REVO_CMAKE_ARCH"
            echo "- Runner: ${{ matrix.runner }} (${{ runner.arch }})"
            echo "- OBS requested version: $OBS_VERSION"
            echo "- Commit: ${{ github.sha }}"
            echo "- Job status: ${{ job.status }}"
          } | tee "$REVO_DIAGNOSTICS/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/revo-macos-${{ matrix.target }}/diagnostics
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [linux, windows, macos]
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release/linux
      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64
      - name: Show release files
        shell: bash
        run: find release -type f -print | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/**/*.AppImage
            release/linux/**/*.deb
            release/linux/**/*.rpm
            release/linux/**/*-linux-x64-portable.tar.gz
            release/linux/**/*-linux-x64.run
            release/linux/**/*-linux-x64-SHA256SUMS.txt
            release/windows/**/*.zip
            release/windows/**/*.exe
            release/windows/**/*.msi
            release/macos-arm64/**/*.dmg
            release/macos-x64/**/*.dmg
          generate_release_notes: true

  dev-release:
    name: Publish dev release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_dev_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    needs: [linux, windows, macos]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release/linux
      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64
      - name: Show dev release files
        shell: bash
        run: find release -type f -print | sort
      - name: Resolve dev build tag
        id: devtag
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists in history — refusing to overwrite. Re-run in the next minute for a fresh tag."
            exit 1
          fi
          REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1 || true)"
          if [ -n "${REMOTE_TAG_SHA}" ]; then
            echo "::error::Tag ${TAG} already exists on the remote — refusing to overwrite."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Dev release tag: ${TAG} (will point to commit ${{ github.sha }})"
      - name: Prepare dev release filenames
        env:
          DEV_TAG: ${{ steps.devtag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="release/dev"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          copy_one() {
            local root="$1" pattern="$2" target="$3"
            mapfile -d '' matches < <(find "$root" -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $pattern in $root, found ${#matches[@]}"
              exit 1
            fi
            cp "${matches[0]}" "$DEST/$target"
          }
          PREFIX="revo-gpui-${DEV_TAG}"
          copy_one release/linux '*.AppImage' "${PREFIX}-linux-x64.AppImage"
          copy_one release/linux '*.deb' "${PREFIX}-linux-x64.deb"
          copy_one release/linux '*.rpm' "${PREFIX}-linux-x64.rpm"
          copy_one release/linux '*-linux-x64-portable.tar.gz' "${PREFIX}-linux-x64-portable.tar.gz"
          copy_one release/linux '*-linux-x64.run' "${PREFIX}-linux-x64.run"
          copy_one release/windows '*.zip' "${PREFIX}-windows-x64.zip"
          copy_one release/windows '*.exe' "${PREFIX}-windows-x64-setup.exe"
          copy_one release/windows '*.msi' "${PREFIX}-windows-x64.msi"
          copy_one release/macos-arm64 '*.dmg' "${PREFIX}-macos-arm64.dmg"
          copy_one release/macos-x64 '*.dmg' "${PREFIX}-macos-x64.dmg"
          (
            cd "$DEST"
            sha256sum "${PREFIX}-linux-x64.AppImage" "${PREFIX}-linux-x64.deb" "${PREFIX}-linux-x64.rpm" \
              "${PREFIX}-linux-x64-portable.tar.gz" "${PREFIX}-linux-x64.run" \
              "${PREFIX}-windows-x64.zip" "${PREFIX}-windows-x64-setup.exe" "${PREFIX}-windows-x64.msi" \
              "${PREFIX}-macos-arm64.dmg" "${PREFIX}-macos-x64.dmg" > "${PREFIX}-SHA256SUMS.txt"
          )
          find "$DEST" -type f -print | sort
      - name: Build release notes
        env:
          DEV_TAG: ${{ steps.devtag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v*' --match '*.*.*' --match 'build-*' 2>/dev/null || true)"
          if [ -n "${LAST_TAG}" ]; then
            COMMIT_LIST="$(git log --pretty=format:'- %s' "${LAST_TAG}..HEAD" || true)"
          else
            COMMIT_LIST="$(git log --pretty=format:'- %s' -n 100 || true)"
          fi
          {
            echo "## ⚠️ Development build — not for production use"
            echo
            echo "This is an automated developer build of the native GPUI RevoStream. It may be unstable and **should not be used in production**."
            echo
            echo "- Build tag: \`${DEV_TAG}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Workflow run: \`${{ github.run_id }}\`"
            echo "- Engine: native GPUI application (UI process + separate libobs engine process)"
            if [ -n "${LAST_TAG}" ]; then
              echo "- Changes since: \`${LAST_TAG}\`"
            else
              echo "- Changes since: no previous release tag found in history"
            fi
            echo
            echo "### Packages"
            echo
            echo "| Platform | Artifacts |"
            echo "| --- | --- |"
            echo "| Linux x64 | AppImage, DEB, RPM, portable tar.gz, self-extracting .run |"
            echo "| Windows x64 | portable ZIP, NSIS setup EXE, MSI |"
            echo "| macOS arm64 / x64 | DMG |"
            echo
            echo "### Commits"
            echo
            if [ -n "${COMMIT_LIST}" ]; then
              printf '%s\n' "${COMMIT_LIST}" | head -n 200
            else
              echo "_No commits found._"
            fi
          } > dev-notes.md
          cat dev-notes.md
      - name: Re-verify tag is still free
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.devtag.outputs.tag }}"
          REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1 || true)"
          if [ -n "${REMOTE_TAG_SHA}" ]; then
            echo "::error::Tag ${TAG} appeared on the remote while this run was building — refusing to overwrite."
            exit 1
          fi
      - name: Publish dev pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.devtag.outputs.tag }}
          name: ${{ steps.devtag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          body_path: dev-notes.md
          files: |
            release/dev/*
      - name: Write dev release summary
        env:
          DEV_TAG: ${{ steps.devtag.outputs.tag }}
        shell: bash
        run: |
          {
            echo "### Dev release published"
            echo
            echo "- Tag: \`${DEV_TAG}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo
            echo "Published files:"
            echo '```'
            find release/dev -type f -print | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
