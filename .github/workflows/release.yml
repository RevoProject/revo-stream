      # ----------------------------------------------------------
      # Prepare complete macOS runtime
      # ----------------------------------------------------------
      - name: Populate macOS revo-root
        shell: bash
        run: |
          ROOT="src-tauri/resources/revo-root"
          OBS_BUILD="$RUNNER_TEMP/obs-build"
          OBS_INSTALL="$RUNNER_TEMP/obs-install"
          rm -rf "$ROOT"
          mkdir -p \
            "$ROOT/data" \
            "$ROOT/core/bin" \
            "$ROOT/core/lib" \
            "$ROOT/core/lib/obs-plugins" \
            "$ROOT/core/share"
          # --------------------------------------------------------
          # RevoStream data
          # --------------------------------------------------------
          if [ -d "data" ]; then
            rsync -a \
              "data/" \
              "$ROOT/data/"
          fi
          # --------------------------------------------------------
          # OBS dylibs
          # --------------------------------------------------------
          DYLIB_COUNT=0
          while IFS= read -r dylib; do
            [ -n "$dylib" ] || continue
            echo "Copying dylib: $dylib"
            cp -L \
              "$dylib" \
              "$ROOT/core/lib/$(basename "$dylib")"
            DYLIB_COUNT=$((DYLIB_COUNT + 1))
          done < <(
            find "$OBS_BUILD" \
              -type f \
              -name "*.dylib" \
              -print |
            sort
          )
          if [ "$DYLIB_COUNT" -eq 0 ]; then
            echo "ERROR: no OBS dylibs found"
            exit 1
          fi
          echo "Collected dylibs: $DYLIB_COUNT"
          # --------------------------------------------------------
          # Frameworks
          # --------------------------------------------------------
          FRAMEWORK_COUNT=0
          while IFS= read -r framework; do
            [ -n "$framework" ] || continue
            name="$(basename "$framework")"
            echo "Copying framework: $name"
            rm -rf \
              "$ROOT/core/lib/$name"
            cp -R \
              "$framework" \
              "$ROOT/core/lib/$name"
            FRAMEWORK_COUNT=$((FRAMEWORK_COUNT + 1))
          done < <(
            find "$OBS_BUILD" \
              -type d \
              -name "*.framework" \
              ! -path "*/EagerLinkingTBDs/*" \
              -print |
            sort -u
          )
          echo "Collected frameworks: $FRAMEWORK_COUNT"
          # --------------------------------------------------------
          # OBS plugins
          # --------------------------------------------------------
          PLUGIN_COUNT=0
          while IFS= read -r plugin; do
            [ -n "$plugin" ] || continue
            name="$(basename "$plugin")"
            echo "Copying plugin: $name"
            rm -rf \
              "$ROOT/core/lib/obs-plugins/$name"
            cp -R \
              "$plugin" \
              "$ROOT/core/lib/obs-plugins/$name"
            PLUGIN_COUNT=$((PLUGIN_COUNT + 1))
          done < <(
            find "$OBS_BUILD" \
              -type d \
              -name "*.plugin" \
              -print |
            sort -u
          )
          if [ "$PLUGIN_COUNT" -eq 0 ]; then
            echo "ERROR: no OBS .plugin bundles found"
            exit 1
          fi
          echo "Collected plugins: $PLUGIN_COUNT"
          # --------------------------------------------------------
          # Installed resources
          # --------------------------------------------------------
          if [ -d "$OBS_INSTALL/share" ]; then
            rsync -a \
              "$OBS_INSTALL/share/" \
              "$ROOT/core/share/"
          fi
          if [ -d "$OBS_INSTALL/bin" ]; then
            rsync -a \
              "$OBS_INSTALL/bin/" \
              "$ROOT/core/bin/"
          fi
          # --------------------------------------------------------
          # Final tree
          # --------------------------------------------------------
          echo
          echo "============================================================"
          echo "FINAL macOS revo-root"
          echo "============================================================"
          find "$ROOT" \
            -maxdepth 8 \
            -print |
          sort |
          head -2000
      # ----------------------------------------------------------
      # Verify macOS runtime
      # ----------------------------------------------------------
      # ----------------------------------------------------------
      # Bundle FFmpeg and Homebrew dylib dependencies.
      # ----------------------------------------------------------
      - name: Bundle macOS FFmpeg dependencies
        shell: bash
        run: |
          set -euo pipefail
          ROOT="src-tauri/resources/revo-root"
          LIB="$ROOT/core/lib"
          FFMPEG_PREFIX="$(brew --prefix ffmpeg)"
          BREW_PREFIX="$(brew --prefix)"
          SEEN_FILE="$RUNNER_TEMP/revo-seen-dylibs.txt"
          QUEUE_FILE="$RUNNER_TEMP/revo-dylib-queue.txt"
          : > "$SEEN_FILE"
          : > "$QUEUE_FILE"
          mkdir -p "$LIB"

          enqueue() {
            local f="$1"
            [ -e "$f" ] || return 0
            local real
            real="$(realpath "$f")"
            [ -f "$real" ] || return 0
            if ! grep -Fqx "$real" "$SEEN_FILE" 2>/dev/null; then
              printf '%s\n' "$real" >> "$SEEN_FILE"
              printf '%s\n' "$real" >> "$QUEUE_FILE"
            fi
          }

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            enqueue "$f"
          done < <(
            find "$FFMPEG_PREFIX/lib" -maxdepth 1 -type f -name "*.dylib" -print | sort
          )

          index=1
          while IFS= read -r binary; do
            [ -n "$binary" ] || continue
            while IFS= read -r dep; do
              dep="${dep#        }"
              dep="${dep%% (*}"
              case "$dep" in
                "$BREW_PREFIX"/*) enqueue "$dep" ;;
              esac
            done < <(otool -L "$binary" 2>/dev/null | tail -n +2)
          done < <(find "$ROOT" -type f \
            \( -perm -111 -o -name "*.dylib" \) -print)

          while IFS= read -r src; do
            [ -n "$src" ] || continue
            dst="$LIB/$(basename "$src")"
            if [ "$(realpath "$src")" != "$(realpath "$dst" 2>/dev/null || echo "$dst")" ]; then
              cp -L "$src" "$dst"
            fi
            while IFS= read -r dep; do
              dep="${dep#        }"
              dep="${dep%% (*}"
              case "$dep" in
                "$BREW_PREFIX"/*) enqueue "$dep" ;;
              esac
            done < <(otool -L "$src" 2>/dev/null | tail -n +2)
          done < "$QUEUE_FILE"

          find "$LIB" -maxdepth 1 -type f -name "*.dylib" -print | sort
      # ----------------------------------------------------------
      # Normalize @rpath / install names.
      # ----------------------------------------------------------
      - name: Normalize macOS runtime rpaths
        shell: bash
        run: |
          set -euo pipefail
          ROOT="src-tauri/resources/revo-root"
          LIB="$ROOT/core/lib"
          BREW_PREFIX="$(brew --prefix)"
          add_rpath() {
            local binary="$1"
            local rpath="$2"
            if ! otool -l "$binary" 2>/dev/null | grep -Fq "path $rpath "; then
              install_name_tool -add_rpath "$rpath" "$binary" 2>/dev/null || true
            fi
          }
          while IFS= read -r dylib; do
            [ -n "$dylib" ] || continue
            install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" 2>/dev/null || true
            add_rpath "$dylib" "@loader_path"
          done < <(
            find "$LIB" -maxdepth 1 -type f -name "*.dylib" -print
          )
          while IFS= read -r binary; do
            [ -n "$binary" ] || continue
            while IFS= read -r dep; do
              dep="${dep#        }"
              dep="${dep%% (*}"
              case "$dep" in
                "$BREW_PREFIX"/*)
                  base="$(basename "$dep")"
                  if [ -f "$LIB/$base" ]; then
                    install_name_tool -change "$dep" "@rpath/$base" "$binary" 2>/dev/null || true
                  fi
                  ;;
              esac
            done < <(otool -L "$binary" 2>/dev/null | tail -n +2)
            case "$binary" in
              */obs-plugins/*.plugin/Contents/MacOS/*)
                add_rpath "$binary" "@loader_path/../../../.."
                ;;
              */libobs.framework/Versions/*/*)
                add_rpath "$binary" "@loader_path/../../../"
                ;;
              */core/lib/*)
                add_rpath "$binary" "@loader_path"
                ;;
            esac
          done < <(find "$ROOT" -type f -print)
      - name: Verify macOS runtime
        shell: bash
        run: |
          ROOT="src-tauri/resources/revo-root"
          if [ ! -d "$ROOT/core/lib" ]; then
            echo "ERROR: core/lib does not exist"
            exit 1
          fi
          if [ ! -d "$ROOT/core/lib/obs-plugins" ]; then
            echo "ERROR: core/lib/obs-plugins does not exist"
            exit 1
          fi
          DYLIB_COUNT=$(
            find "$ROOT/core/lib" \
              -type f \
              -name "*.dylib" |
            wc -l |
            tr -d ' '
          )
          echo "macOS dylibs: $DYLIB_COUNT"
          if [ "$DYLIB_COUNT" -eq 0 ]; then
            echo "ERROR: no macOS dylibs found"
            exit 1
          fi
          for lib in \
            libavcodec.dylib \
            libavformat.dylib \
            libavutil.dylib \
            libswresample.dylib \
            libswscale.dylib
          do
            test -f "$ROOT/core/lib/$lib" || {
              echo "ERROR: required FFmpeg library missing: $ROOT/core/lib/$lib"
              exit 1
            }
          done
          echo "Required FFmpeg dylibs are staged"
          PLUGIN_COUNT=$(
            find "$ROOT/core/lib/obs-plugins" \
              -type d \
              -name "*.plugin" |
            wc -l |
            tr -d ' '
          )
          echo "macOS OBS plugins: $PLUGIN_COUNT"
          if [ "$PLUGIN_COUNT" -eq 0 ]; then
            echo "ERROR: no OBS .plugin bundles found"
            exit 1
          fi
          WINDOWS_BINARIES=$(
            find "$ROOT" \
              -type f \
              \( \
                -name "*.dll" \
                -o -name "*.exe" \
                -o -name "*.pdb" \
              \) \
              -print
          )
          if [ -n "$WINDOWS_BINARIES" ]; then
            echo "ERROR: Windows binaries leaked into macOS runtime:"
            echo "$WINDOWS_BINARIES"
            exit 1
          fi
          echo
          echo "============================================================"
          echo "macOS dylibs"
          echo "============================================================"
          find "$ROOT/core/lib" \
            -type f \
            -name "*.dylib" \
            -print |
          sort
          echo
          echo "============================================================"
          echo "macOS OBS plugins"
          echo "============================================================"
          find "$ROOT/core/lib/obs-plugins" \
            -type d \
            -name "*.plugin" \
            -print |
          sort
          echo
          echo "============================================================"
          echo "macOS frameworks"
          echo "============================================================"
          find "$ROOT/core/lib" \
            -type d \
            -name "*.framework" \
            -print |
          sort
          echo
          echo "macOS runtime layout looks valid"
      # ----------------------------------------------------------
      # Tauri
      # ----------------------------------------------------------
      - name: Build macOS DMG
        shell: bash
        run: |
          pnpm tauri build \
            --bundles dmg \
            --target "${{ matrix.target }}" \
            -- \
            --no-default-features
      # ----------------------------------------------------------
      # Verify DMG
      # ----------------------------------------------------------
      # ----------------------------------------------------------
      # Verify final .app is self-contained.
      # ----------------------------------------------------------
      - name: Verify final macOS app
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          APP_DIR="src-tauri/target/$TARGET/release/bundle/macos"
          APP="$(
            find "$APP_DIR" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print -quit
          )"
          if [ -z "$APP" ]; then
            echo "ERROR: .app was not produced"
            find "src-tauri/target/$TARGET/release/bundle" -maxdepth 3 -print || true
            exit 1
          fi
          ROOT="$APP/Contents/Resources/resources/revo-root"
          EXE="$APP/Contents/MacOS/revo-ui"
          test -x "$EXE"
          test -d "$ROOT/core/lib"
          test -d "$ROOT/core/lib/obs-plugins"
          for lib in \
            libavcodec.dylib \
            libavformat.dylib \
            libavutil.dylib \
            libswresample.dylib \
            libswscale.dylib
          do
            test -f "$ROOT/core/lib/$lib" || {
              echo "ERROR: final app is missing $lib"
              exit 1
            }
          done
          echo "=== FINAL APP SIZE ==="
          du -sh "$APP"
          du -sh "$ROOT"
          BAD="$(
            find "$APP" -type f -print0 |
              while IFS= read -r -d '' f; do
                file "$f" 2>/dev/null | grep -q "Mach-O" || continue
                otool -L "$f" 2>/dev/null || true
              done |
              grep -E '/opt/homebrew/|/usr/local/opt/' || true
          )"
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "ERROR: final app still contains Homebrew absolute dylib references"
            exit 1
          fi
          echo "Final macOS .app is self-contained"
      - name: Verify macOS DMG
        shell: bash
        run: |
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          DMG=$(
            find "$DMG_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.dmg" \
              -print -quit
          )
          if [ -z "$DMG" ]; then
            echo "ERROR: DMG was not produced"
            echo "Expected directory: $DMG_DIR"
            exit 1
          fi
          echo "macOS DMG:"
          ls -lh "$DMG"
      # ----------------------------------------------------------
      # Upload macOS artifact
      # ----------------------------------------------------------
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
  # ============================================================
  # RELEASE
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - macos
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release/linux
      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64
      - name: Show release files
        shell: bash
        run: |
          find release \
            -type f \
            -print |
          sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/**/*.AppImage
            release/linux/**/*.deb
            release/linux/**/*.rpm
            release/linux/**/*-linux-x64-portable.tar.gz
            release/linux/**/*-linux-x64.run
            release/linux/**/*-linux-x64-SHA256SUMS.txt
            release/windows/**/*.msi
            release/windows/**/*.zip
            release/macos-arm64/**/*.dmg
            release/macos-x64/**/*.dmg
          generate_release_notes: true
