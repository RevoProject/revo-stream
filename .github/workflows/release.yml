name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PNPM_VERSION: 10
  NODE_VERSION: 24

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable CEF for CI build
        shell: pwsh
        run: |
          $path = "src-tauri/Cargo.toml"
          $content = Get-Content $path -Raw

          $content = $content.Replace(
            'cef = ["dep:revo-cef"]',
            'cef = []'
          )

          $content = $content.Replace(
            'revo-cef = { path = "../../modules/revo-cef", optional = true }',
            ''
          )

          Set-Content -Path $path -Value $content -NoNewline

          Write-Host "CEF disabled for CI"
          Select-String -Path $path -Pattern "cef|revo-cef" || $true

      - name: Prepare revo-root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src-tauri/resources/revo-root" | Out-Null

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-obs-build
        run: cargo install cargo-obs-build --locked

      - name: Bootstrap OBS
        working-directory: src-tauri
        run: cargo obs-build build --out-dir target/release

      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi -- --no-default-features

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $zip = "src-tauri/target/release/bundle/revo-ui-windows-x64.zip"
          $exe = "src-tauri/target/release/revo-ui.exe"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }

          Compress-Archive `
            -Path $exe `
            -DestinationPath $zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/revo-ui-windows-x64.zip

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install SIMDe
        run: |
          brew install simde
          echo "CPATH=$(brew --prefix simde)/include:${CPATH:-}" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$(brew --prefix simde)/include:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$(brew --prefix simde)/include:${CPLUS_INCLUDE_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify SIMDe
        run: |
          SIMDE="$(brew --prefix simde)"
          test -f "$SIMDE/include/simde/x86/sse2.h"
          echo "SIMDe headers found:"
          ls "$SIMDE/include/simde/x86/sse2.h"

      - name: Disable CEF for CI build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/Cargo.toml")
          content = path.read_text()

          content = content.replace(
              'cef = ["dep:revo-cef"]',
              'cef = []'
          )

          content = content.replace(
              'revo-cef = { path = "../../modules/revo-cef", optional = true }',
              ''
          )

          path.write_text(content)

          print("CEF disabled for CI")
          PY

          grep -nE 'cef|revo-cef' src-tauri/Cargo.toml || true

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Patch libobs bindgen for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".cargo/git/checkouts"
          matches = list(root.glob("libobs-rs-*/7e76c91/libobs/build.rs"))

          if not matches:
              raise SystemExit("libobs-rs build.rs not found")

          p = matches[0]
          s = p.read_text()

          print(f"Using libobs build.rs: {p}")

          if "builder = builder.layout_tests(false);" in s:
              print("libobs bindgen patch already applied")
              raise SystemExit(0)

          needle = '        .clang_arg(format!("-I{}", "headers/obs"));'

          if needle not in s:
              print("Could not find expected clang_arg line.")
              print("Relevant bindgen section:")

              start = s.find("let mut builder = bindgen::builder()")

              if start != -1:
                  end = s.find("let bindings =", start)

                  if end == -1:
                      end = min(start + 2500, len(s))

                  print(s[start:end])

              raise SystemExit(1)

          replacement = (
              needle
              + "\n\n"
              + '    #[cfg(target_os = "macos")]'
              + "\n"
              + "    {"
              + "\n"
              + "        builder = builder.layout_tests(false);"
              + "\n"
              + "    }"
          )

          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          print("libobs bindgen patch applied successfully")
          PY

      - name: Verify libobs bindgen patch
        shell: bash
        run: |
          BUILD_RS=$(find "$HOME/.cargo/git/checkouts" \
            -path "*/7e76c91/libobs/build.rs" \
            -print -quit)

          if [ -z "$BUILD_RS" ]; then
            echo "libobs build.rs not found"
            exit 1
          fi

          echo "Using: $BUILD_RS"

          grep -n -C 5 "layout_tests" "$BUILD_RS"

      - name: Prepare revo-root
        run: |
          mkdir -p src-tauri/resources/revo-root

      - name: Install cargo-obs-build
        run: cargo install cargo-obs-build --locked

      - name: Bootstrap OBS
        working-directory: src-tauri
        run: |
          cargo obs-build build \
            --out-dir "target/${{ matrix.target }}/release"

      - name: Build macOS DMG
        run: |
          pnpm tauri build \
            --bundles dmg \
            --target "${{ matrix.target }}" \
            -- \
            --no-default-features

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - windows
      - macos

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64

      - name: Show release files
        run: |
          find release -maxdepth 4 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*.msi
            release/windows/**/*.zip
            release/macos-arm64/**/*.dmg
            release/macos-x64/**/*.dmg
          generate_release_notes: true
