name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
permissions:
  contents: write
env:
  PNPM_VERSION: 10
  NODE_VERSION: 24
  OBS_VERSION: 32.1.2
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  # Ubuntu 24.04 / glibc 2.39 is the Linux runtime baseline. RPM packages
  # require a compatible RPM distribution, not an arbitrary older Linux host.
  linux:
    name: Linux x64 (AppImage, DEB, RPM, portable)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules ninja-build pkg-config clang libclang-dev \
            curl wget file patchelf xdg-utils rpm makeself \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev \
            libsimde-dev uthash-dev libjansson-dev nlohmann-json3-dev \
            libcurl4-openssl-dev libmbedtls-dev uuid-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev libx264-dev \
            libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xinerama0-dev libxcb-composite0-dev libxcb-xfixes0-dev \
            libxinerama-dev libxcomposite-dev libxss-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev \
            libjack-jackd2-dev libsndio-dev libspeexdsp-dev \
            libfontconfig-dev libfreetype6-dev libudev-dev libv4l-dev \
            libva-dev libpci-dev libdrm-dev librist-dev libsrt-openssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Disable unavailable sibling CEF dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/Cargo.toml")
          text = path.read_text()
          text = text.replace('cef = ["dep:revo-cef"]', 'cef = []')
          text = text.replace('revo-cef = { path = "../../modules/revo-cef", optional = true }', '')
          path.write_text(text)
          PY
      - name: Build matching OBS runtime
        run: |
          set -euo pipefail
          OBS_SRC="$RUNNER_TEMP/obs-studio"
          OBS_BUILD="$RUNNER_TEMP/obs-build"
          OBS_INSTALL="$RUNNER_TEMP/obs-install"
          git clone --depth 1 --branch "$OBS_VERSION" --recursive \
            https://github.com/obsproject/obs-studio.git "$OBS_SRC"
          cmake -S "$OBS_SRC" -B "$OBS_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$OBS_INSTALL" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DENABLE_RELOCATABLE=ON \
            -DENABLE_FRONTEND=OFF -DENABLE_BROWSER=OFF -DENABLE_SCRIPTING=OFF \
            -DENABLE_AJA=OFF -DENABLE_DECKLINK=OFF -DENABLE_VLC=OFF \
            -DENABLE_VST=OFF -DENABLE_WEBRTC=OFF -DENABLE_WEBSOCKET=OFF \
            -DENABLE_NVENC=OFF -DENABLE_QSV11=OFF
          cmake --build "$OBS_BUILD" --parallel 2
          cmake --install "$OBS_BUILD"
          test -f "$OBS_INSTALL/lib/libobs.so"
          echo "LIBOBS_PATH=$OBS_INSTALL/lib" >> "$GITHUB_ENV"
          echo "REVO_OBS_LIB_DIR=$OBS_INSTALL/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$OBS_INSTALL/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$OBS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          # The same usr/bin -> usr/lib layout is used by Tauri's AppDir and native packages.
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN/../lib/revo-ui/resources/revo-root/core/lib' >> "$GITHUB_ENV"
      - name: Stage OBS libraries, plugins and helper dependencies
        run: bash scripts/prepare-linux-runtime.sh "$RUNNER_TEMP/obs-install"
      - name: Build Linux AppImage, DEB and RPM
        run: |
          pnpm tauri build \
            --config src-tauri/tauri.release-linux.conf.json \
            --bundles appimage,deb,rpm -- --no-default-features
      - name: Create portable AppDir archive and self-extracting launcher
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE="src-tauri/target/release/bundle"
          appdirs=("$BUNDLE"/appimage/*.AppDir)
          test "${#appdirs[@]}" -eq 1
          APPDIR="${appdirs[0]}"
          test -x "$APPDIR/AppRun"
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tar -C "$(dirname "$APPDIR")" -czf \
            "$BUNDLE/revo-ui-${VERSION}-linux-x64-portable.tar.gz" "$(basename "$APPDIR")"
          makeself --nox11 "$APPDIR" "$BUNDLE/revo-ui-${VERSION}-linux-x64.run" \
            "RevoStream ${VERSION}" ./AppRun
      - name: Verify Linux release files and generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE="src-tauri/target/release/bundle"
          for pattern in "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/deb/*.deb \
            "$BUNDLE"/rpm/*.rpm "$BUNDLE"/*-linux-x64-portable.tar.gz "$BUNDLE"/*-linux-x64.run; do
            test -s "$pattern"
          done
          appimages=("$BUNDLE"/appimage/*.AppImage)
          debs=("$BUNDLE"/deb/*.deb)
          rpms=("$BUNDLE"/rpm/*.rpm)
          archives=("$BUNDLE"/*-linux-x64-portable.tar.gz)
          launchers=("$BUNDLE"/*-linux-x64.run)
          for files in appimages debs rpms archives launchers; do
            declare -n entries="$files"
            test "${#entries[@]}" -gt 0
          done
          for deb in "${debs[@]}"; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          for rpm in "${rpms[@]}"; do
            rpm -qp --requires "$rpm"
            rpm -qplp "$rpm"
          done
          for archive in "${archives[@]}"; do tar -tzf "$archive"; done
          for launcher in "${launchers[@]}"; do bash "$launcher" --check; done
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          (cd "$BUNDLE" && sha256sum appimage/*.AppImage deb/*.deb rpm/*.rpm \
            *-linux-x64-portable.tar.gz *-linux-x64.run > "revo-ui-${VERSION}-linux-x64-SHA256SUMS.txt")
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/*-linux-x64-portable.tar.gz
            src-tauri/target/release/bundle/*-linux-x64.run
            src-tauri/target/release/bundle/*-linux-x64-SHA256SUMS.txt
  # ============================================================
  # WINDOWS
  # ============================================================
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      # ----------------------------------------------------------
      # Checkout / toolchain
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # ----------------------------------------------------------
      # CEF
      # ----------------------------------------------------------
      - name: Disable CEF for CI build
        shell: pwsh
        run: |
          $path = "src-tauri/Cargo.toml"
          $content = Get-Content $path -Raw
          $content = $content.Replace(
            'cef = ["dep:revo-cef"]',
            'cef = []'
          )
          $content = $content.Replace(
            'revo-cef = { path = "../../modules/revo-cef", optional = true }',
            ''
          )
          Set-Content `
            -Path $path `
            -Value $content `
            -NoNewline
          Write-Host "CEF disabled for CI"
      # ----------------------------------------------------------
      # Runtime resources
      # ----------------------------------------------------------
      - name: Prepare revo-root
        shell: pwsh
        run: |
          Remove-Item `
            "src-tauri/resources/revo-root" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue
          New-Item `
            -ItemType Directory `
            -Force `
            "src-tauri/resources/revo-root" | Out-Null
      # ----------------------------------------------------------
      # Rust dependencies
      # ----------------------------------------------------------
      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml
      # ----------------------------------------------------------
      # libobs-bootstrapper
      # ----------------------------------------------------------
      - name: Verify libobs-bootstrapper
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\.cargo\git\checkouts"
          $bootstrapper = Get-ChildItem `
            $root `
            -Recurse `
            -Filter Cargo.toml |
            Where-Object {
              $_.FullName -like "*\7e76c91\libobs-bootstrapper\Cargo.toml"
            } |
            Select-Object -First 1
          if (-not $bootstrapper) {
            throw "libobs-bootstrapper Cargo.toml not found"
          }
          $dir = Split-Path $bootstrapper.FullName
          $cargo = Get-Content $bootstrapper.FullName -Raw
          Write-Host "Using bootstrapper: $dir"
          if ($cargo -notmatch '(?ms)default\s*=\s*\[[^\]]*["'']install_dummy_dll["''][^\]]*\]') {
            throw "libobs-bootstrapper install_dummy_dll is not enabled by default"
          }
          $dummy = Join-Path $dir "assets\obs-dummy.dll"
          if (-not (Test-Path $dummy)) {
            throw "Dummy DLL not found: $dummy"
          }
          Write-Host "install_dummy_dll: enabled"
          Write-Host "dummy DLL: $dummy"
      - name: Install cargo-obs-build
        run: cargo install cargo-obs-build --locked
      # ----------------------------------------------------------
      # OBS runtime
      # ----------------------------------------------------------
      - name: Bootstrap OBS
        working-directory: src-tauri
        shell: pwsh
        run: cargo obs-build build --out-dir target/release
      - name: Verify Windows OBS runtime
        shell: pwsh
        run: |
          $out = "src-tauri/target/release"
          $obs = "$out/obs.dll"
          if (-not (Test-Path $obs)) {
            throw "OBS runtime missing: $obs"
          }
          $size = (Get-Item $obs).Length
          Write-Host "obs.dll size: $size bytes"
          if ($size -lt 500000) {
            throw "obs.dll is unexpectedly small"
          }
          $plugins = "$out/obs-plugins"
          if (-not (Test-Path $plugins)) {
            throw "OBS plugin directory missing: $plugins"
          }
          $pluginCount = @(
            Get-ChildItem `
              $plugins `
              -Recurse `
              -Filter "*.dll" `
              -File
          ).Count
          Write-Host "OBS plugin DLLs: $pluginCount"
          if ($pluginCount -eq 0) {
            throw "No OBS plugin DLLs found"
          }
          if (Test-Path "$out/data") {
            Write-Host "OBS data directory found"
          }
          else {
            throw "OBS data directory missing"
          }
          Write-Host "Windows OBS runtime looks valid"
      # ----------------------------------------------------------
      # Prepare complete Windows runtime
      # ----------------------------------------------------------
      - name: Populate Windows revo-root
        shell: pwsh
        run: |
          $OUT = "src-tauri/target/release"
          $ROOT = "src-tauri/resources/revo-root"
          Remove-Item $ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$ROOT\data" | Out-Null
          New-Item -ItemType Directory -Force "$ROOT\core\bin" | Out-Null
          New-Item -ItemType Directory -Force "$ROOT\core\lib" | Out-Null
          New-Item -ItemType Directory -Force "$ROOT\core\lib\obs-plugins" | Out-Null
          New-Item -ItemType Directory -Force "$ROOT\core\share" | Out-Null

          if (Test-Path "data") { Copy-Item "data\*" "$ROOT\data" -Recurse -Force }

          $dlls = @(Get-ChildItem $OUT -Filter "*.dll" -File -ErrorAction SilentlyContinue)
          if ($dlls.Count -eq 0) { throw "No OBS DLLs found in $OUT" }
          foreach ($dll in $dlls) { Copy-Item $dll.FullName "$ROOT\core\lib\$($dll.Name)" -Force }

          $pluginSource = "$OUT\obs-plugins"
          if (-not (Test-Path $pluginSource)) { throw "OBS obs-plugins directory missing" }
          Copy-Item "$pluginSource\*" "$ROOT\core\lib\obs-plugins" -Recurse -Force

          if (Test-Path "$OUT\bin") { Copy-Item "$OUT\bin\*" "$ROOT\core\bin" -Recurse -Force }
          if (Test-Path "$OUT\share") { Copy-Item "$OUT\share\*" "$ROOT\core\share" -Recurse -Force }
          if (Test-Path "$OUT\data") { Copy-Item "$OUT\data\*" "$ROOT\data" -Recurse -Force }

          $runtimeObs = "$ROOT\core\lib\obs.dll"
          if (-not (Test-Path $runtimeObs)) { throw "Staged obs.dll missing: $runtimeObs" }
          $runtimePlugins = @(Get-ChildItem "$ROOT\core\lib\obs-plugins" -Recurse -Filter "*.dll" -File).Count
          if ($runtimePlugins -eq 0) { throw "No staged OBS plugins found" }
          Write-Host "Staged OBS plugin DLLs: $runtimePlugins"
      # ----------------------------------------------------------
      # Verify Windows runtime before Tauri
      # ----------------------------------------------------------
      - name: Verify Windows runtime
        shell: pwsh
        run: |
          $ROOT = "src-tauri/resources/revo-root"
          $required = @(
            "$ROOT\core\lib\obs.dll",
            "$ROOT\core\lib\obs-plugins",
            "$ROOT\data"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required runtime path missing: $path"
            }
            Write-Host "OK: $path"
          }
          $dllCount = @(
            Get-ChildItem `
              "$ROOT\core\lib" `
              -Filter "*.dll" `
              -File
          ).Count
          $pluginCount = @(
            Get-ChildItem `
              "$ROOT\core\lib\obs-plugins" `
              -Recurse `
              -Filter "*.dll" `
              -File
          ).Count
          Write-Host "Core DLLs: $dllCount"
          Write-Host "Plugin DLLs: $pluginCount"
          if ($dllCount -eq 0) {
            throw "No core DLLs staged"
          }
          if ($pluginCount -eq 0) {
            throw "No plugin DLLs staged"
          }
          Write-Host "Windows runtime is complete"
      # ----------------------------------------------------------
      # Tauri
      # ----------------------------------------------------------
      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi -- --no-default-features
      # ----------------------------------------------------------
      # Verify MSI
      # ----------------------------------------------------------
      - name: Verify Windows MSI
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue)
          if ($msi.Count -eq 0) { throw "MSI was not produced" }
          foreach ($item in $msi) { Write-Host "MSI: $($item.FullName)" }
      # ----------------------------------------------------------
      # Portable ZIP
      # ----------------------------------------------------------
      - name: Create Windows Portable ZIP
        shell: pwsh
        run: |
          $target = "src-tauri/target/release"
          $bundleDir = "$target/bundle"
          $portable = "$bundleDir/revo-ui-windows-x64-portable"
          $zip = "$bundleDir/revo-ui-windows-x64.zip"
          $exe = "$target/revo-ui.exe"
          $obsDll = "$target/obs.dll"
          $root = "src-tauri/resources/revo-root"

          Remove-Item $portable -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          if (-not (Test-Path $obsDll)) { throw "Real OBS DLL not found: $obsDll" }
          if (-not (Test-Path $root)) { throw "revo-root not found: $root" }
          $obsSize = (Get-Item $obsDll).Length
          if ($obsSize -lt 500000) { throw "target/release/obs.dll is unexpectedly small; refusing to package dummy DLL" }

          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $exe "$portable\revo-ui.exe" -Force
          Copy-Item $obsDll "$portable\obs.dll" -Force

          # Only root-level DLLs are duplicated here because Windows/bootstrapper
          # needs them beside revo-ui.exe. Do not copy bin/data/obs-plugins again.
          Get-ChildItem $target -Filter "*.dll" -File | ForEach-Object {
            Copy-Item $_.FullName "$portable\$($_.Name)" -Force
          }
          Copy-Item $root "$portable\revo-root" -Recurse -Force

          if (-not (Test-Path "$portable\revo-root\core\lib\obs.dll")) { throw "Portable revo-root/core/lib/obs.dll missing" }
          if (-not (Test-Path "$portable\revo-root\core\lib\obs-plugins")) { throw "Portable revo-root/core/lib/obs-plugins missing" }
          $pluginCount = @(Get-ChildItem "$portable\revo-root\core\lib\obs-plugins" -Recurse -Filter "*.dll" -File).Count
          if ($pluginCount -eq 0) { throw "No OBS plugins found in portable revo-root" }

          Compress-Archive -Path "$portable\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Portable ZIP was not created" }

          $verifyDir = "$bundleDir\portable-verify"
          Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $verifyDir | Out-Null
          Expand-Archive -Path $zip -DestinationPath $verifyDir -Force
          if (-not (Test-Path "$verifyDir\revo-ui.exe")) { throw "ZIP verification failed: revo-ui.exe missing" }
          if (-not (Test-Path "$verifyDir\obs.dll")) { throw "ZIP verification failed: root obs.dll missing" }
          if (-not (Test-Path "$verifyDir\revo-root\core\lib\obs.dll")) { throw "ZIP verification failed: revo-root/core/lib/obs.dll missing" }
          $verifiedObsSize = (Get-Item "$verifyDir\obs.dll").Length
          if ($verifiedObsSize -lt 500000) { throw "ZIP verification failed: root obs.dll is dummy/small" }
          if (-not (Test-Path "$verifyDir\revo-root\core\lib\obs-plugins")) { throw "ZIP verification failed: OBS plugins missing" }
          if (@(Get-ChildItem "$verifyDir\revo-root\core\lib\obs-plugins" -Recurse -Filter "*.dll" -File).Count -eq 0) { throw "ZIP verification failed: no OBS plugin DLLs" }
          Write-Host "ZIP verification passed"
          Remove-Item $verifyDir -Recurse -Force
          Remove-Item $portable -Recurse -Force
      # ----------------------------------------------------------
      # Upload Windows artifacts
      # ----------------------------------------------------------
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/revo-ui-windows-x64.zip
  # ============================================================
  # macOS
  # ============================================================
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            cmake_arch: arm64
          - arch: x64
            target: x86_64-apple-darwin
            cmake_arch: x86_64
    steps:
      # ----------------------------------------------------------
      # Checkout / toolchain
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version
          cmake --version
          xcodebuild -version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # ----------------------------------------------------------
      # SIMDe
      # ----------------------------------------------------------
      - name: Install SIMDe
        shell: bash
        run: |
          brew install simde
          echo "CPATH=$(brew --prefix simde)/include:${CPATH:-}" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$(brew --prefix simde)/include:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$(brew --prefix simde)/include:${CPLUS_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
      - name: Verify SIMDe
        shell: bash
        run: |
          SIMDE="$(brew --prefix simde)"
          HEADER="$SIMDE/include/simde/x86/sse2.h"
          if [ ! -f "$HEADER" ]; then
            echo "SIMDe header not found: $HEADER"
            exit 1
          fi
          echo "SIMDe header found:"
          ls -l "$HEADER"
      # ----------------------------------------------------------
      # CEF
      # ----------------------------------------------------------
      # ----------------------------------------------------------
      # FFmpeg
      # ----------------------------------------------------------
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          brew install ffmpeg
          FFMPEG_PREFIX="$(brew --prefix ffmpeg)"
          BREW_PREFIX="$(brew --prefix)"
          echo "FFMPEG_PREFIX=$FFMPEG_PREFIX" >> "$GITHUB_ENV"
          echo "BREW_PREFIX=$BREW_PREFIX" >> "$GITHUB_ENV"
          test -d "$FFMPEG_PREFIX/lib"
          for lib in \
            libavcodec.dylib \
            libavformat.dylib \
            libavutil.dylib \
            libswresample.dylib \
            libswscale.dylib
          do
            test -f "$FFMPEG_PREFIX/lib/$lib" || {
              echo "Missing FFmpeg library: $FFMPEG_PREFIX/lib/$lib"
              exit 1
            }
          done
          find "$FFMPEG_PREFIX/lib" -maxdepth 1 -type f -name "*.dylib" -print | sort
      - name: Disable CEF for CI build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/Cargo.toml")
          text = path.read_text()
          text = text.replace(
              'cef = ["dep:revo-cef"]',
              'cef = []'
          )
          text = text.replace(
              'revo-cef = { path = "../../modules/revo-cef", optional = true }',
              ''
          )
          path.write_text(text)
          print("CEF disabled for CI")
          PY
      # ----------------------------------------------------------
      # OBS logger
      # ----------------------------------------------------------
      - name: Disable OBS logger on non-Linux CI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          linux_cfg = '#[cfg(target_os = "linux")]'

          # logging/mod.rs
          mod = Path("src-tauri/src/logging/mod.rs")
          text = mod.read_text()
          text = re.sub(
              r'(?m)^[ \t]*#\[cfg\([^\n]+\)\]\n([ \t]*pub mod obs_logger;)',
              linux_cfg + r'\n\1',
              text,
              count=1,
          )
          if linux_cfg + "\npub mod obs_logger;" not in text:
              raise SystemExit("ERROR: obs_logger module was not made Linux-only")
          mod.write_text(text)

          # logging/obs_logger.rs
          logger = Path("src-tauri/src/logging/obs_logger.rs")
          if logger.exists():
              logger_text = logger.read_text()
              logger_text = re.sub(
                  r'\A#!\[cfg\([^\n]+\)\]\n?',
                  linux_cfg.replace('#[', '#![') + "\n",
                  logger_text,
                  count=1,
              )
              if not logger_text.startswith('#![cfg(target_os = "linux")]'):
                  logger_text = '#![cfg(target_os = "linux")]\n\n' + logger_text
              logger.write_text(logger_text)

          # runtime/init.rs
          init = Path("src-tauri/src/runtime/init.rs")
          init_text = init.read_text()
          marker = "crate::logging::obs_logger::obs_log_handler"
          statement = "revo_lib::obs::base_set_log_handler("

          if marker not in init_text:
              raise SystemExit("ERROR: obs_log_handler reference not found in runtime/init.rs")

          handler_pos = init_text.find(marker)
          statement_start = init_text.rfind(statement, 0, handler_pos)

          if statement_start == -1:
              raise SystemExit("ERROR: base_set_log_handler call not found")

          line_start = init_text.rfind("\n", 0, statement_start) + 1
          statement_prefix = init_text[line_start:statement_start]

          if statement_prefix.strip():
              raise SystemExit("ERROR: unexpected content before base_set_log_handler")

          indent = statement_prefix
          prefix = init_text[:line_start]
          prefix_lines = prefix.splitlines(keepends=True)

          while prefix_lines and not prefix_lines[-1].strip():
              prefix_lines.pop()

          while prefix_lines and re.fullmatch(
              r'[ \t]*#\[cfg\([^\n]+\)\][ \t]*',
              prefix_lines[-1].rstrip("\r\n")
          ):
              prefix_lines.pop()
              while prefix_lines and not prefix_lines[-1].strip():
                  prefix_lines.pop()

          prefix = "".join(prefix_lines)
          if prefix and not prefix.endswith("\n"):
              prefix += "\n"

          init_text = (
              prefix
              + f'{indent}#[cfg(target_os = "linux")]\n'
              + init_text[line_start:]
          )
          init.write_text(init_text)

          # Verify the exact call that references obs_log_handler.
          init_text = init.read_text()
          handler_pos = init_text.find(marker)
          statement_start = init_text.rfind(statement, 0, handler_pos)

          if statement_start == -1:
              raise SystemExit("ERROR: base_set_log_handler call disappeared")

          line_start = init_text.rfind("\n", 0, statement_start) + 1
          before_call = init_text[:line_start].splitlines()

          while before_call and not before_call[-1].strip():
              before_call.pop()

          if (
              not before_call
              or before_call[-1].strip()
              != '#[cfg(target_os = "linux")]'
          ):
              raise SystemExit(
                  "ERROR: exact OBS logger call is not Linux-only"
              )

          print("OBS logger is Linux-only")
          PY
      # ----------------------------------------------------------
      # Rust dependencies
      # ----------------------------------------------------------
      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml
      # ----------------------------------------------------------
      # libobs bindgen
      # ----------------------------------------------------------
      - name: Patch libobs bindgen for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path.home() / ".cargo/git/checkouts"
          matches = list(
              root.glob("libobs-rs-*/7e76c91/libobs/build.rs")
          )
          if not matches:
              raise SystemExit(
                  "libobs build.rs not found"
              )
          path = matches[0]
          text = path.read_text()
          print(f"Using libobs build.rs: {path}")
          if "builder = builder.layout_tests(false);" in text:
              print("libobs bindgen patch already present")
              raise SystemExit(0)
          needle = (
              '        .clang_arg(format!("-I{}", "headers/obs"));'
          )
          if needle not in text:
              raise SystemExit(
                  "Expected clang_arg line not found in libobs/build.rs"
              )
          replacement = (
              needle
              + "\n\n"
              + '    #[cfg(target_os = "macos")]'
              + "\n"
              + "    {"
              + "\n"
              + "        builder = builder.layout_tests(false);"
              + "\n"
              + "    }"
          )
          path.write_text(
              text.replace(
                  needle,
                  replacement,
                  1
              )
          )
          print("libobs bindgen macOS patch applied")
          PY
      # ----------------------------------------------------------
      # libobs-wrapper
      # ----------------------------------------------------------
      - name: Patch libobs-wrapper for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path.home() / ".cargo/git/checkouts"
          matches = list(
              root.glob("libobs-rs-*/7e76c91/libobs-wrapper/src")
          )
          if not matches:
              raise SystemExit(
                  "libobs-wrapper source not found"
              )
          src = matches[0]
          other = src / "utils/initialization/other.rs"
          runtime = src / "runtime.rs"
          if not other.exists():
              raise SystemExit(
                  f"Missing file: {other}"
              )
          if not runtime.exists():
              raise SystemExit(
                  f"Missing file: {runtime}"
              )
          print(f"Using libobs-wrapper source: {src}")
          # --------------------------------------------------------
          # Rc must exist on macOS.
          # --------------------------------------------------------
          text = other.read_text()
          linux_rc = (
              '#[cfg(target_os = "linux")]\n'
              'use std::rc::Rc;'
          )
          if linux_rc in text:
              text = text.replace(
                  linux_rc,
                  'use std::rc::Rc;',
                  1
              )
              print(
                  "Removed Linux-only cfg from Rc import"
              )
          elif 'use std::rc::Rc;' in text:
              print(
                  "Rc import is already unconditional"
              )
          else:
              raise SystemExit(
                  "use std::rc::Rc; not found in libobs-wrapper"
              )
          lines = text.splitlines()
          # --------------------------------------------------------
          # PlatformSpecificGuard
          # --------------------------------------------------------
          struct_index = None
          for i, line in enumerate(lines):
              if (
                  line.strip()
                  == "pub(crate) struct PlatformSpecificGuard {"
              ):
                  struct_index = i
                  break
          if struct_index is None:
              raise SystemExit(
                  "PlatformSpecificGuard struct not found"
              )
          if (
              struct_index == 0
              or lines[struct_index - 1].strip()
              != '#[cfg(target_os = "linux")]'
          ):
              derive_index = struct_index
              if (
                  derive_index > 0
                  and lines[derive_index - 1].strip()
                  == "#[derive(Debug)]"
              ):
                  derive_index -= 1
              lines.insert(
                  derive_index,
                  '#[cfg(target_os = "linux")]'
              )
          # Re-find struct.
          struct_index = None
          for i, line in enumerate(lines):
              if (
                  line.strip()
                  == "pub(crate) struct PlatformSpecificGuard {"
              ):
                  struct_index = i
                  break
          if struct_index is None:
              raise SystemExit(
                  "PlatformSpecificGuard struct disappeared"
              )
          depth = 0
          end_index = None
          started = False
          for i in range(struct_index, len(lines)):
              line = lines[i]
              if "{" in line:
                  depth += line.count("{")
                  started = True
              if "}" in line and started:
                  depth -= line.count("}")
                  if depth == 0:
                      end_index = i
                      break
          if end_index is None:
              raise SystemExit(
                  "Could not find end of PlatformSpecificGuard"
              )
          stub_exists = any(
              line.strip()
              == "pub(crate) struct PlatformSpecificGuard;"
              for line in lines
          )
          if not stub_exists:
              lines[end_index + 1:end_index + 1] = [
                  "",
                  '#[cfg(not(target_os = "linux"))]',
                  "#[derive(Debug)]",
                  "pub(crate) struct PlatformSpecificGuard;",
              ]
          # --------------------------------------------------------
          # Drop is Linux-only.
          # --------------------------------------------------------
          for i, line in enumerate(lines):
              if (
                  line.strip()
                  == "impl Drop for PlatformSpecificGuard {"
              ):
                  if (
                      i == 0
                      or lines[i - 1].strip()
                      != '#[cfg(target_os = "linux")]'
                  ):
                      lines.insert(
                          i,
                          '#[cfg(target_os = "linux")]'
                      )
                  break
          other.write_text(
              "\n".join(lines) + "\n"
          )
          # --------------------------------------------------------
          # runtime.rs
          # --------------------------------------------------------
          runtime_text = runtime.read_text()
          old = (
              "platform_specific_setup(info.nix_display.clone())?"
          )
          new = "platform_specific_setup()?"
          if old in runtime_text:
              runtime_text = runtime_text.replace(
                  old,
                  new,
                  1
              )
              runtime.write_text(runtime_text)
              print(
                  "Removed nix_display argument for macOS"
              )
          elif new in runtime_text:
              print(
                  "macOS platform_specific_setup call already patched"
              )
          else:
              raise SystemExit(
                  "Expected platform_specific_setup call not found"
              )
          print(
              "libobs-wrapper macOS patch applied"
          )
          PY
      # ----------------------------------------------------------
      # Verify Rust patches
