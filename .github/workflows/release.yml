name: Release
on:
  push:
    tags:
      # Repo tags use plain semver (0.4.0), keep v-prefixed for compatibility.
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_dev_release:
        description: "Publish dev release"
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  # Manual dispatches are globally serialized so dev-release jobs cannot race
  # on the same-minute tag. Tag pushes keep a per-ref group.
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-dispatch' || format('release-{0}', github.ref) }}
  cancel-in-progress: false
env:
  PNPM_VERSION: 10
  NODE_VERSION: 24
  OBS_VERSION: 32.1.2
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  # Ubuntu 24.04 / glibc 2.39 is the Linux runtime baseline. RPM packages
  # require a compatible RPM distribution, not an arbitrary older Linux host.
  linux:
    name: Linux x64 (AppImage, DEB, RPM, portable)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Record build metadata
        shell: bash
        run: |
          {
            echo "### Linux x64 build metadata"
            echo ""
            echo "- Commit: `${{ github.sha }}`"
            echo "- Ref: `${{ github.ref_name }}`"
            echo "- Run: `${{ github.run_id }}`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build and packaging dependencies
        run: bash scripts/linux/install-dependencies.sh
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Disable unavailable sibling CEF dependency
        run: python3 scripts/release/disable-cef.py
      - name: Build matching OBS runtime
        run: bash scripts/linux/build-obs.sh
      - name: Stage OBS libraries, plugins and helper dependencies
        run: bash scripts/linux/prepare-runtime.sh "$RUNNER_TEMP/obs-install"
      - name: Build Linux AppImage, DEB and RPM
        run: |
          pnpm tauri build \
            --config src-tauri/tauri.release-linux.conf.json \
            --bundles appimage,deb,rpm -- --no-default-features
      - name: Create portable AppDir archive and self-extracting launcher
        run: bash scripts/linux/package-portable.sh
      - name: Verify Linux release files and generate checksums
        run: bash scripts/linux/verify-release.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/*-linux-x64-portable.tar.gz
            src-tauri/target/release/bundle/*-linux-x64.run
            src-tauri/target/release/bundle/*-linux-x64-SHA256SUMS.txt
  # ============================================================
  # WINDOWS
  # ============================================================
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      # ----------------------------------------------------------
      # Checkout / toolchain
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5
      - name: Record build metadata
        shell: bash
        run: |
          {
            echo "### Windows x64 build metadata"
            echo ""
            echo "- Commit: `${{ github.sha }}`"
            echo "- Ref: `${{ github.ref_name }}`"
            echo "- Run: `${{ github.run_id }}`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # ----------------------------------------------------------
      # CEF
      # ----------------------------------------------------------
      - name: Disable CEF for CI build
        shell: bash
        run: python3 scripts/release/disable-cef.py
      # ----------------------------------------------------------
      # Runtime resources
      # ----------------------------------------------------------
      - name: Prepare revo-root
        shell: pwsh
        run: ./scripts/windows/prepare-revo-root.ps1
      # ----------------------------------------------------------
      # Rust dependencies
      # ----------------------------------------------------------
      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml
      # ----------------------------------------------------------
      # libobs-bootstrapper
      # ----------------------------------------------------------
      - name: Patch libobs-bootstrapper dummy DLL feature
        shell: pwsh
        run: ./scripts/windows/patch-libobs-bootstrapper.ps1
      - name: Install cargo-obs-build
        run: cargo install cargo-obs-build --locked
      # ----------------------------------------------------------
      # OBS runtime
      # ----------------------------------------------------------
      - name: Bootstrap OBS
        working-directory: src-tauri
        shell: pwsh
        run: cargo obs-build build --out-dir target/release
      - name: Verify Windows OBS runtime
        shell: pwsh
        run: ./scripts/windows/verify-obs-runtime.ps1
      # ----------------------------------------------------------
      # Prepare complete Windows runtime
      # ----------------------------------------------------------
      - name: Populate Windows revo-root
        shell: pwsh
        run: ./scripts/windows/prepare-runtime.ps1
      # ----------------------------------------------------------
      # Verify Windows runtime before Tauri
      # ----------------------------------------------------------
      - name: Verify Windows runtime
        shell: pwsh
        run: ./scripts/windows/verify-runtime.ps1
      # ----------------------------------------------------------
      # Tauri
      # ----------------------------------------------------------
      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi -- --no-default-features
      # ----------------------------------------------------------
      # Verify MSI
      # ----------------------------------------------------------
      - name: Verify Windows MSI
        shell: pwsh
        run: ./scripts/windows/verify-msi.ps1
      # ----------------------------------------------------------
      # Portable ZIP
      # ----------------------------------------------------------
      - name: Create Windows Portable ZIP
        shell: pwsh
        run: ./scripts/windows/create-portable-zip.ps1
      # ----------------------------------------------------------
      # Upload Windows artifacts
      # ----------------------------------------------------------
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/revo-ui-windows-x64.zip
  # ============================================================
  # macOS
  # ============================================================
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      REVO_TARGET: ${{ matrix.target }}
      REVO_ARCH: ${{ matrix.arch }}
      REVO_CMAKE_ARCH: ${{ matrix.cmake_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            cmake_arch: arm64
          - arch: x64
            target: x86_64-apple-darwin
            cmake_arch: x86_64
    steps:
      # ----------------------------------------------------------
      # Checkout / toolchain
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5
      - name: Record build metadata
        shell: bash
        run: |
          {
            echo "### macOS ${{ matrix.arch }} build metadata"
            echo ""
            echo "- Commit: `${{ github.sha }}`"
            echo "- Ref: `${{ github.ref_name }}`"
            echo "- Run: `${{ github.run_id }}`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version
          cmake --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # ----------------------------------------------------------
      # SIMDe
      # ----------------------------------------------------------
      - name: Install SIMDe
        shell: bash
        run: bash scripts/macos/install-simde.sh
      - name: Verify SIMDe
        shell: bash
        run: bash scripts/macos/verify-simde.sh
      # ----------------------------------------------------------
      # CEF
      # ----------------------------------------------------------
      # ----------------------------------------------------------
      # FFmpeg
      # ----------------------------------------------------------
      - name: Install FFmpeg
        shell: bash
        run: bash scripts/macos/install-ffmpeg.sh
      - name: Disable CEF for CI build
        shell: bash
        run: python3 scripts/macos/disable-cef.py

      - name: Disable OBS logger on non-Linux CI
        shell: bash
        run: python3 scripts/macos/disable-obs-logger.py

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml
      # ----------------------------------------------------------
      # libobs bindgen
      # ----------------------------------------------------------
      - name: Patch libobs bindgen for macOS
        shell: bash
        run: python3 scripts/macos/patch-libobs-bindgen.py

      - name: Patch libobs-wrapper for macOS
        shell: bash
        run: python3 scripts/macos/patch-libobs-wrapper.py

      - name: Verify libobs patches
        shell: bash
        run: bash scripts/macos/verify-libobs-patches.sh

      - name: Prepare revo-root
        shell: bash
        run: |
          rm -rf src-tauri/resources/revo-root
          mkdir -p src-tauri/resources/revo-root
      # ----------------------------------------------------------
      # OBS Studio
      # ----------------------------------------------------------
      - name: Checkout OBS Studio
        shell: bash
        run: bash scripts/macos/checkout-obs.sh

      - name: Patch OBS libobs-metal Swift
        shell: bash
        run: python3 scripts/macos/patch-obs-metal-swift.py

      - name: Patch OBS macOS virtual camera warnings
        shell: bash
        run: python3 scripts/macos/patch-obs-virtualcam-warnings.py

      - name: Verify OBS source patches
        shell: bash
        run: bash scripts/macos/verify-obs-source-patches.sh

      - name: Configure OBS Studio
        shell: bash
        run: bash scripts/macos/configure-obs.sh

      - name: Build OBS Studio
        shell: bash
        run: |
          cmake \
            --build "$RUNNER_TEMP/obs-build" \
            --config RelWithDebInfo \
            --parallel "$(sysctl -n hw.ncpu)"
      # ----------------------------------------------------------
      # OBS install
      # ----------------------------------------------------------
      - name: Install OBS Studio
        shell: bash
        run: bash scripts/macos/install-obs.sh

      - name: Configure libobs linker path
        shell: bash
        run: bash scripts/macos/configure-libobs-linker-path.sh

      - name: Inspect macOS OBS build
        shell: bash
        run: bash scripts/macos/inspect-obs-build.sh

      - name: Reject Windows OBS binaries
        shell: bash
        run: bash scripts/macos/reject-windows-binaries.sh

      - name: Populate macOS revo-root
        shell: bash
        run: bash scripts/macos/populate-revo-root.sh

      - name: Bundle macOS FFmpeg dependencies
        shell: bash
        run: bash scripts/macos/bundle-ffmpeg-dependencies.sh

      - name: Normalize macOS runtime rpaths
        shell: bash
        run: bash scripts/macos/normalize-runtime-rpaths.sh

      - name: Verify macOS runtime
        shell: bash
        run: bash scripts/macos/verify-runtime.sh

      - name: Build macOS app
        shell: bash
        run: |
          pnpm tauri build \
            --bundles app \
            --target "${{ matrix.target }}" \
            -- \
            --no-default-features

      # ----------------------------------------------------------
      # Normalize final .app Mach-O dependencies
      # ----------------------------------------------------------
      - name: Normalize final macOS app dylib paths
        shell: bash
        run: bash scripts/macos/normalize-app-dylib-paths.sh

      - name: Build macOS DMG from normalized app
        shell: bash
        run: bash scripts/macos/build-dmg.sh

      - name: Verify final macOS app
        shell: bash
        run: bash scripts/macos/verify-app.sh

      - name: Verify macOS DMG
        shell: bash
        run: bash scripts/macos/verify-dmg.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
  # ============================================================
  # RELEASE (tag pushes only)
  # ============================================================
  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - linux
      - windows
      - macos
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release/linux
      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64
      - name: Show release files
        shell: bash
        run: |
          find release \
            -type f \
            -print |
          sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/**/*.AppImage
            release/linux/**/*.deb
            release/linux/**/*.rpm
            release/linux/**/*-linux-x64-portable.tar.gz
            release/linux/**/*-linux-x64.run
            release/linux/**/*-linux-x64-SHA256SUMS.txt
            release/windows/**/*.msi
            release/windows/**/*.zip
            release/macos-arm64/**/*.dmg
            release/macos-x64/**/*.dmg
          generate_release_notes: true
  # ============================================================
  # DEV RELEASE (manual dispatch, optional, default ON)
  # Tag format: build-YYYYMMDD-HHMM (UTC, 24h)
  # ============================================================
  dev-release:
    name: Publish dev release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_dev_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    needs:
      - linux
      - windows
      - macos
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release/linux
      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64
      - name: Show dev release files
        shell: bash
        run: |
          find release \
            -type f \
            -print |
          sort
      - name: Resolve dev build tag
        id: devtag
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists in history — refusing to overwrite. Re-run in the next minute for a fresh tag."
            exit 1
          fi
          REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1 || true)"
          if [ -n "${REMOTE_TAG_SHA}" ]; then
            echo "::error::Tag ${TAG} already exists on the remote (created by another run) — refusing to overwrite."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Dev release tag: ${TAG} (will point to commit ${{ github.sha }})"
      - name: Build release notes
        env:
          DEV_TAG: ${{ steps.devtag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v*' --match '*.*.*' --match 'build-*' 2>/dev/null || true)"
          if [ -n "${LAST_TAG}" ]; then
            COMMIT_LIST="$(git log --pretty=format:'- %s' "${LAST_TAG}..HEAD" || true)"
          else
            COMMIT_LIST="$(git log --pretty=format:'- %s' -n 100 || true)"
          fi
          {
            echo "## ⚠️ Development build — not for production use"
            echo ""
            echo "This is an automated developer build of RevoStream. It may be unstable and **should not be used in production**."
            echo ""
            echo "- Build tag: \`${DEV_TAG}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Workflow run: \`${{ github.run_id }}\`"
            if [ -n "${LAST_TAG}" ]; then
              echo "- Changes since: \`${LAST_TAG}\`"
            else
              echo "- Changes since: no previous release tag found in history"
            fi
            echo ""
            echo "### Commits"
            echo ""
            if [ -n "${COMMIT_LIST}" ]; then
              printf '%s\n' "${COMMIT_LIST}" | head -n 200
            else
              echo "_No commits found._"
            fi
          } > dev-notes.md
          echo "--- dev-notes.md ---"
          cat dev-notes.md
      - name: Re-verify tag is still free
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.devtag.outputs.tag }}"
          REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1 || true)"
          if [ -n "${REMOTE_TAG_SHA}" ]; then
            echo "::error::Tag ${TAG} appeared on the remote while this run was building — refusing to overwrite."
            exit 1
          fi
      - name: Publish dev pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.devtag.outputs.tag }}
          name: ${{ steps.devtag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          body_path: dev-notes.md
          files: |
            release/linux/**/*.AppImage
            release/linux/**/*.deb
            release/linux/**/*.rpm
            release/linux/**/*-linux-x64-portable.tar.gz
            release/linux/**/*-linux-x64.run
            release/linux/**/*-linux-x64-SHA256SUMS.txt
            release/windows/**/*.msi
            release/windows/**/*.zip
            release/macos-arm64/**/*.dmg
            release/macos-x64/**/*.dmg
      - name: Write dev release summary
        env:
          DEV_TAG: ${{ steps.devtag.outputs.tag }}
        shell: bash
        run: |
          {
            echo "### Dev release published"
            echo ""
            echo "- Tag: \`${DEV_TAG}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Published files:"
            echo '```'
            find release -type f -print | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
