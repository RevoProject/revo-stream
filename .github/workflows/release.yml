name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PNPM_VERSION: 10
  NODE_VERSION: 24
  OBS_VERSION: 32.1.2
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable CEF for CI build
        shell: pwsh
        run: |
          $path = "src-tauri/Cargo.toml"
          $content = Get-Content $path -Raw

          $content = $content.Replace(
            'cef = ["dep:revo-cef"]',
            'cef = []'
          )

          $content = $content.Replace(
            'revo-cef = { path = "../../modules/revo-cef", optional = true }',
            ''
          )

          Set-Content -Path $path -Value $content -NoNewline

          Write-Host "CEF disabled for CI"

      - name: Prepare revo-root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src-tauri/resources/revo-root" | Out-Null

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Verify libobs-bootstrapper
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\.cargo\git\checkouts"

          $bootstrapper = Get-ChildItem $root -Recurse -Filter Cargo.toml |
            Where-Object {
              $_.FullName -like "*\7e76c91\libobs-bootstrapper\Cargo.toml"
            } |
            Select-Object -First 1

          if (-not $bootstrapper) {
            throw "libobs-bootstrapper Cargo.toml not found"
          }

          $dir = Split-Path $bootstrapper.FullName

          Write-Host "Using: $dir"

          $cargo = Get-Content $bootstrapper.FullName -Raw

          if ($cargo -notmatch 'default\s*=\s*\["install_dummy_dll"\]') {
            throw "libobs-bootstrapper install_dummy_dll is not enabled by default"
          }

          $dummy = Join-Path $dir "assets\obs-dummy.dll"

          if (-not (Test-Path $dummy)) {
            throw "Dummy DLL not found: $dummy"
          }

          Write-Host "install_dummy_dll: enabled"
          Write-Host "dummy DLL: $dummy"

      - name: Install cargo-obs-build
        run: cargo install cargo-obs-build --locked

      - name: Bootstrap OBS
        working-directory: src-tauri
        shell: pwsh
        run: cargo obs-build build --out-dir target/release

      - name: Verify OBS bootstrap
        shell: pwsh
        run: |
          $obs = "src-tauri/target/release/obs.dll"

          if (-not (Test-Path $obs)) {
            throw "OBS DLL not found: $obs"
          }

          $size = (Get-Item $obs).Length

          Write-Host "obs.dll size: $size bytes"

          if ($size -lt 500000) {
            throw "obs.dll is unexpectedly small"
          }

      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi -- --no-default-features

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $zip = "src-tauri/target/release/bundle/revo-ui-windows-x64.zip"
          $exe = "src-tauri/target/release/revo-ui.exe"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }

          Compress-Archive `
            -Path $exe `
            -DestinationPath $zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/revo-ui-windows-x64.zip


  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            cmake_arch: arm64

          - arch: x64
            target: x86_64-apple-darwin
            cmake_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version
          xcodebuild -version
          cmake --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install SIMDe
        run: |
          brew install simde

          echo "CPATH=$(brew --prefix simde)/include:${CPATH:-}" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$(brew --prefix simde)/include:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$(brew --prefix simde)/include:${CPLUS_INCLUDE_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify SIMDe
        run: |
          SIMDE="$(brew --prefix simde)"

          test -f "$SIMDE/include/simde/x86/sse2.h"

          echo "SIMDe headers found:"
          ls -l "$SIMDE/include/simde/x86/sse2.h"

      - name: Disable CEF for CI build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/Cargo.toml")
          content = path.read_text()

          content = content.replace(
              'cef = ["dep:revo-cef"]',
              'cef = []'
          )

          content = content.replace(
              'revo-cef = { path = "../../modules/revo-cef", optional = true }',
              ''
          )

          path.write_text(content)

          print("CEF disabled for CI")
          PY

          grep -nE 'cef|revo-cef' src-tauri/Cargo.toml || true

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Patch libobs bindgen for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".cargo/git/checkouts"

          matches = list(
              root.glob("libobs-rs-*/7e76c91/libobs/build.rs")
          )

          if not matches:
              raise SystemExit("libobs-rs build.rs not found")

          path = matches[0]
          text = path.read_text()

          print(f"Using libobs build.rs: {path}")

          if "builder = builder.layout_tests(false);" in text:
              print("libobs bindgen patch already applied")
              raise SystemExit(0)

          needle = '        .clang_arg(format!("-I{}", "headers/obs"));'

          if needle not in text:
              raise SystemExit(
                  "Could not find expected clang_arg line in libobs/build.rs"
              )

          replacement = (
              needle
              + "\n\n"
              + '#[cfg(target_os = "macos")]'
              + "\n"
              + "{"
              + "\n"
              + "    builder = builder.layout_tests(false);"
              + "\n"
              + "}"
          )

          path.write_text(text.replace(needle, replacement, 1))

          print("libobs bindgen patch applied")
          PY

      - name: Patch libobs-wrapper for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".cargo/git/checkouts"

          matches = list(
              root.glob("libobs-rs-*/7e76c91/libobs-wrapper/src")
          )

          if not matches:
              raise SystemExit("libobs-wrapper source not found")

          src = matches[0]

          other = src / "utils/initialization/other.rs"
          runtime = src / "runtime.rs"

          print(f"Using libobs-wrapper source: {src}")

          # Rc is also required by the non-Linux stub.
          text = other.read_text()

          old = '#[cfg(target_os = "linux")]\nuse std::rc::Rc;'
          new = 'use std::rc::Rc;'

          if old in text:
              text = text.replace(old, new, 1)

          # Linux implementation.
          old = '''#[derive(Debug)]
pub(crate) struct PlatformSpecificGuard {
    display: Sendable<*mut std::os::raw::c_void>,
    platform: PlatformType,
    /// Whether the guard owns the display connection and should close it on drop
    owned: bool,
}'''

          new = '''#[cfg(target_os = "linux")]
#[derive(Debug)]
pub(crate) struct PlatformSpecificGuard {
    display: Sendable<*mut std::os::raw::c_void>,
    platform: PlatformType,
    /// Whether the guard owns the display connection and should close it on drop
    owned: bool,
}

#[cfg(not(target_os = "linux"))]
#[derive(Debug)]
pub(crate) struct PlatformSpecificGuard;'''

          if old in text:
              text = text.replace(old, new, 1)

          # X11/Wayland Drop is Linux-only.
          old = 'impl Drop for PlatformSpecificGuard {'

          new = '''#[cfg(target_os = "linux")]
impl Drop for PlatformSpecificGuard {'''

          if old in text and new not in text:
              text = text.replace(old, new, 1)

          other.write_text(text)

          # macOS does not pass the Linux display handle.
          text = runtime.read_text()

          old = 'platform_specific_setup(info.nix_display.clone())?'
          new = 'platform_specific_setup()?'

          if old in text:
              runtime.write_text(text.replace(old, new, 1))

          print("libobs-wrapper macOS patch applied")
          PY

      - name: Verify libobs patches
        shell: bash
        run: |
          echo "=== libobs bindgen ==="

          BUILD_RS=$(find "$HOME/.cargo/git/checkouts" \
            -path "*/7e76c91/libobs/build.rs" \
            -print -quit)

          if [ -z "$BUILD_RS" ]; then
            echo "libobs build.rs not found"
            exit 1
          fi

          echo "Using: $BUILD_RS"
          grep -n -C 5 "layout_tests" "$BUILD_RS"

          echo
          echo "=== libobs-wrapper ==="

          WRAPPER_SRC=$(find "$HOME/.cargo/git/checkouts" \
            -path "*/7e76c91/libobs-wrapper/src" \
            -type d \
            -print -quit)

          if [ -z "$WRAPPER_SRC" ]; then
            echo "libobs-wrapper source not found"
            exit 1
          fi

          echo "Using: $WRAPPER_SRC"

          echo
          echo "--- other.rs ---"
          head -n 30 "$WRAPPER_SRC/utils/initialization/other.rs"

          echo
          echo "--- runtime.rs ---"
          grep -n -C 4 "platform_specific_setup" \
            "$WRAPPER_SRC/runtime.rs" || true

      - name: Prepare revo-root
        run: |
          rm -rf src-tauri/resources/revo-root
          mkdir -p src-tauri/resources/revo-root

      # OBS 32.1.2 has a macOS libobs-metal CMake bug:
      # libobs-metal contains Swift sources but does not enable Swift.
      - name: Clone OBS Studio
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch "${OBS_VERSION}" \
            --recursive \
            https://github.com/obsproject/obs-studio.git \
            "$RUNNER_TEMP/obs-studio"

      - name: Verify OBS source
        shell: bash
        run: |
          OBS_SRC="$RUNNER_TEMP/obs-studio"

          test -f "$OBS_SRC/CMakeLists.txt"
          test -f "$OBS_SRC/libobs-metal/CMakeLists.txt"

          echo "OBS source:"
          git -C "$OBS_SRC" log -1 --oneline

          echo
          echo "OBS version:"
          grep -n "OBS_VERSION_CANONICAL" \
            "$OBS_SRC/cmake/common/version.cmake" || true

      - name: Patch OBS libobs-metal Swift
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/obs-studio/libobs-metal/CMakeLists.txt" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "enable_language(Swift)" in text:
              print("Swift language already enabled")
              raise SystemExit(0)

          text = "enable_language(Swift)\n\n" + text

          path.write_text(text)

          print(f"Patched: {path}")
          PY

          head -n 10 "$RUNNER_TEMP/obs-studio/libobs-metal/CMakeLists.txt"

      - name: Configure OBS Studio
        shell: bash
        run: |
          OBS_SRC="$RUNNER_TEMP/obs-studio"
          OBS_BUILD="$RUNNER_TEMP/obs-build"

          cmake \
            -S "$OBS_SRC" \
            -B "$OBS_BUILD" \
            --preset macos \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_BROWSER=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_FRONTEND=OFF

      - name: Build OBS Studio
        shell: bash
        run: |
          cmake \
            --build "$RUNNER_TEMP/obs-build" \
            --config RelWithDebInfo \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Install OBS Studio
        shell: bash
        run: |
          OBS_INSTALL="$RUNNER_TEMP/obs-install"

          rm -rf "$OBS_INSTALL"
          mkdir -p "$OBS_INSTALL"

          cmake \
            --install "$RUNNER_TEMP/obs-build" \
            --config RelWithDebInfo \
            --prefix "$OBS_INSTALL"

      - name: Inspect OBS install
        shell: bash
        run: |
          OBS_INSTALL="$RUNNER_TEMP/obs-install"

          echo "=== OBS install ==="
          find "$OBS_INSTALL" -maxdepth 5 -type f -print | sort | head -500

          echo
          echo "=== Dynamic libraries ==="
          find "$OBS_INSTALL" -type f \
            \( -name "*.dylib" -o -name "*.framework" \) \
            -print

          echo
          echo "=== Windows binaries - MUST be empty ==="
          WINDOWS_BINARIES=$(find "$OBS_INSTALL" -type f \
            \( -name "*.dll" -o -name "*.exe" -o -name "*.pdb" \) \
            -print)

          if [ -n "$WINDOWS_BINARIES" ]; then
            echo "$WINDOWS_BINARIES"
            echo "ERROR: Windows binaries found in macOS OBS installation"
            exit 1
          fi

      - name: Populate revo-root
        shell: bash
        run: |
          OBS_INSTALL="$RUNNER_TEMP/obs-install"
          REVO_ROOT="$GITHUB_WORKSPACE/src-tauri/resources/revo-root"

          mkdir -p "$REVO_ROOT"

          for dir in data lib share bin; do
            if [ -d "$OBS_INSTALL/$dir" ]; then
              echo "Copying $dir"
              rsync -a "$OBS_INSTALL/$dir/" "$REVO_ROOT/$dir/"
            fi
          done

          echo
          echo "=== revo-root ==="
          find "$REVO_ROOT" -maxdepth 5 -type f -print | sort | head -500

      - name: Verify revo-root
        shell: bash
        run: |
          REVO_ROOT="src-tauri/resources/revo-root"

          test -d "$REVO_ROOT"

          echo "=== OBS plugins ==="
          find "$REVO_ROOT" -type f \
            \( -name "*.so" -o -name "*.dylib" \) \
            -print | sort || true

          echo
          echo "=== Check for Windows binaries ==="

          WINDOWS_BINARIES=$(find "$REVO_ROOT" -type f \
            \( -name "*.dll" -o -name "*.exe" -o -name "*.pdb" \) \
            -print)

          if [ -n "$WINDOWS_BINARIES" ]; then
            echo "$WINDOWS_BINARIES"
            echo "ERROR: Windows binaries found in revo-root"
            exit 1
          fi

      - name: Build macOS DMG
        run: |
          pnpm tauri build \
            --bundles dmg \
            --target "${{ matrix.target }}" \
            -- \
            --no-default-features

      - name: Verify macOS DMG
        shell: bash
        run: |
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"

          echo "=== DMG output ==="
          find "$DMG_DIR" -maxdepth 1 -type f -print

          COUNT=$(find "$DMG_DIR" -maxdepth 1 -type f -name "*.dmg" | wc -l)

          if [ "$COUNT" -lt 1 ]; then
            echo "No DMG produced"
            exit 1
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg


  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - windows
      - macos

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64

      - name: Show release files
        run: |
          find release -maxdepth 5 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*.msi
            release/windows/**/*.zip
            release/macos-arm64/**/*.dmg
            release/macos-x64/**/*.dmg
          generate_release_notes: true
