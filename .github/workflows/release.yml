name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PNPM_VERSION: 10
  NODE_VERSION: 24
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OBS_VERSION: 32.1.2

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable CEF for CI build
        shell: pwsh
        run: |
          $path = "src-tauri/Cargo.toml"
          $content = Get-Content $path -Raw

          $content = $content.Replace(
            'cef = ["dep:revo-cef"]',
            'cef = []'
          )

          $content = $content.Replace(
            'revo-cef = { path = "../../modules/revo-cef", optional = true }',
            ''
          )

          Set-Content -Path $path -Value $content -NoNewline

          Write-Host "CEF disabled for CI"

      - name: Prepare revo-root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src-tauri/resources/revo-root" | Out-Null

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Verify libobs-bootstrapper
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\.cargo\git\checkouts"

          $bootstrapper = Get-ChildItem $root -Recurse -Filter Cargo.toml |
            Where-Object {
              $_.FullName -like "*\7e76c91\libobs-bootstrapper\Cargo.toml"
            } |
            Select-Object -First 1

          if (-not $bootstrapper) {
            throw "libobs-bootstrapper Cargo.toml not found"
          }

          $dir = Split-Path $bootstrapper.FullName
          $cargo = Get-Content $bootstrapper.FullName -Raw

          Write-Host "Using bootstrapper: $dir"

          if ($cargo -notmatch 'default\s*=\s*\["install_dummy_dll"\]') {
            throw "libobs-bootstrapper install_dummy_dll is not enabled by default"
          }

          $dummy = Join-Path $dir "assets\obs-dummy.dll"

          if (-not (Test-Path $dummy)) {
            throw "Dummy DLL not found: $dummy"
          }

          Write-Host "install_dummy_dll: enabled"
          Write-Host "dummy DLL: $dummy"

      - name: Install cargo-obs-build
        run: cargo install cargo-obs-build --locked

      - name: Bootstrap OBS
        working-directory: src-tauri
        shell: pwsh
        run: cargo obs-build build --out-dir target/release

      - name: Verify Windows OBS runtime
        shell: pwsh
        run: |
          $out = "src-tauri/target/release"

          if (-not (Test-Path "$out/obs.dll")) {
            throw "OBS runtime missing: $out/obs.dll"
          }

          $size = (Get-Item "$out/obs.dll").Length
          Write-Host "obs.dll size: $size bytes"

          if ($size -lt 500000) {
            throw "obs.dll is unexpectedly small"
          }

          Write-Host "Windows OBS runtime looks valid"

      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi -- --no-default-features

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $zip = "src-tauri/target/release/bundle/revo-ui-windows-x64.zip"
          $exe = "src-tauri/target/release/revo-ui.exe"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }

          Compress-Archive `
            -Path $exe `
            -DestinationPath $zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/revo-ui-windows-x64.zip


  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            cmake_arch: arm64
          - arch: x64
            target: x86_64-apple-darwin
            cmake_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version
          cmake --version
          xcodebuild -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install SIMDe
        run: |
          brew install simde

          echo "CPATH=$(brew --prefix simde)/include:${CPATH:-}" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$(brew --prefix simde)/include:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$(brew --prefix simde)/include:${CPLUS_INCLUDE_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify SIMDe
        run: |
          SIMDE="$(brew --prefix simde)"

          test -f "$SIMDE/include/simde/x86/sse2.h"

          echo "SIMDe headers found:"
          ls "$SIMDE/include/simde/x86/sse2.h"

      - name: Disable CEF for CI build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/Cargo.toml")
          content = path.read_text()

          content = content.replace(
              'cef = ["dep:revo-cef"]',
              'cef = []'
          )

          content = content.replace(
              'revo-cef = { path = "../../modules/revo-cef", optional = true }',
              ''
          )

          path.write_text(content)

          print("CEF disabled for CI")
          PY

          grep -nE 'cef|revo-cef' src-tauri/Cargo.toml || true

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Patch libobs bindgen for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".cargo/git/checkouts"

          matches = list(
              root.glob("libobs-rs-*/7e76c91/libobs/build.rs")
          )

          if not matches:
              raise SystemExit("libobs-rs build.rs not found")

          p = matches[0]
          s = p.read_text()

          print(f"Using libobs build.rs: {p}")

          if "builder = builder.layout_tests(false);" in s:
              print("libobs bindgen patch already applied")
              raise SystemExit(0)

          needle = '        .clang_arg(format!("-I{}", "headers/obs"));'

          if needle not in s:
              raise SystemExit(
                  "Could not find expected clang_arg line"
              )

          replacement = (
              needle
              + "\n\n"
              + '    #[cfg(target_os = "macos")]'
              + "\n"
              + "    {"
              + "\n"
              + "        builder = builder.layout_tests(false);"
              + "\n"
              + "    }"
          )

          p.write_text(s.replace(needle, replacement, 1))

          print("libobs bindgen patch applied successfully")
          PY

      - name: Patch libobs-wrapper for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".cargo/git/checkouts"

          matches = list(
              root.glob("libobs-rs-*/7e76c91/libobs-wrapper/src")
          )

          if not matches:
              raise SystemExit("libobs-wrapper source not found")

          src = matches[0]
          other = src / "utils/initialization/other.rs"
          runtime = src / "runtime.rs"

          print(f"Using libobs-wrapper source: {src}")

          s = other.read_text()

          old = '#[cfg(target_os = "linux")]\nuse std::rc::Rc;'
          new = 'use std::rc::Rc;'

          if old in s:
              s = s.replace(old, new, 1)

          old = '''#[derive(Debug)]
          pub(crate) struct PlatformSpecificGuard {
              display: Sendable<*mut std::os::raw::c_void>,
              platform: PlatformType,
              /// Whether the guard owns the display connection and should close it on drop
              owned: bool,
          }'''

          new = '''#[cfg(target_os = "linux")]
          #[derive(Debug)]
          pub(crate) struct PlatformSpecificGuard {
              display: Sendable<*mut std::os::raw::c_void>,
              platform: PlatformType,
              /// Whether the guard owns the display connection and should close it on drop
              owned: bool,
          }

          #[cfg(not(target_os = "linux"))]
          #[derive(Debug)]
          pub(crate) struct PlatformSpecificGuard;'''

          if old in s:
              s = s.replace(old, new, 1)

          old = 'impl Drop for PlatformSpecificGuard {'
          new = '''#[cfg(target_os = "linux")]
          impl Drop for PlatformSpecificGuard {'''

          if old in s and new not in s:
              s = s.replace(old, new, 1)

          other.write_text(s)

          s = runtime.read_text()

          old = 'platform_specific_setup(info.nix_display.clone())?'
          new = 'platform_specific_setup()?'

          if old in s:
              s = s.replace(old, new, 1)
              runtime.write_text(s)

          print("libobs-wrapper macOS patch applied")
          PY

      - name: Verify libobs patches
        shell: bash
        run: |
          echo "=== libobs bindgen ==="

          BUILD_RS=$(find "$HOME/.cargo/git/checkouts" \
            -path "*/7e76c91/libobs/build.rs" \
            -print -quit)

          if [ -z "$BUILD_RS" ]; then
            echo "libobs build.rs not found"
            exit 1
          fi

          grep -n -C 5 "layout_tests" "$BUILD_RS"

          echo
          echo "=== libobs-wrapper ==="

          WRAPPER_SRC=$(find "$HOME/.cargo/git/checkouts" \
            -path "*/7e76c91/libobs-wrapper/src" \
            -type d \
            -print -quit)

          if [ -z "$WRAPPER_SRC" ]; then
            echo "libobs-wrapper source not found"
            exit 1
          fi

          echo "--- other.rs ---"
          head -n 12 "$WRAPPER_SRC/utils/initialization/other.rs"

          echo
          echo "--- runtime.rs ---"
          grep -n -C 4 "platform_specific_setup" \
            "$WRAPPER_SRC/runtime.rs" || true

      - name: Prepare revo-root
        run: |
          rm -rf src-tauri/resources/revo-root
          mkdir -p src-tauri/resources/revo-root

      # ------------------------------------------------------------------
      # OBS Studio is built natively on macOS.
      #
      # cargo-obs-build currently downloads Windows OBS assets, which are
      # not usable on macOS. Do not use it here.
      # ------------------------------------------------------------------

      - name: Checkout OBS Studio
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/obs-studio"

          git clone \
            --depth 1 \
            --branch "${OBS_VERSION}" \
            --recursive \
            https://github.com/obsproject/obs-studio.git \
            "$RUNNER_TEMP/obs-studio"

      - name: Configure OBS Studio
        shell: bash
        run: |
          cmake \
            -S "$RUNNER_TEMP/obs-studio" \
            -B "$RUNNER_TEMP/obs-studio/build" \
            -G Xcode \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DENABLE_BROWSER=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_FRONTEND=OFF

      - name: Build OBS Studio
        shell: bash
        run: |
          cmake \
            --build "$RUNNER_TEMP/obs-studio/build" \
            --config RelWithDebInfo \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Install OBS Studio
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/obs-install"

          cmake \
            --install "$RUNNER_TEMP/obs-studio/build" \
            --config RelWithDebInfo \
            --prefix "$RUNNER_TEMP/obs-install"

      - name: Inspect macOS OBS build
        shell: bash
        run: |
          echo "=== OBS build ==="

          find "$RUNNER_TEMP/obs-studio/build" \
            -type f \
            \( -name "*.dylib" -o -name "*.framework" \) \
            -print | sort | head -300

          echo
          echo "=== OBS install ==="

          find "$RUNNER_TEMP/obs-install" \
            -type f \
            -print | sort | head -300

      - name: Reject Windows OBS binaries
        shell: bash
        run: |
          if find "$RUNNER_TEMP/obs-install" \
            -type f \
            \( -name "*.dll" -o -name "*.exe" -o -name "*.pdb" \) \
            -print -quit | grep -q .; then
            echo "ERROR: Windows OBS binaries found in macOS OBS installation"
            find "$RUNNER_TEMP/obs-install" \
              -type f \
              \( -name "*.dll" -o -name "*.exe" -o -name "*.pdb" \) \
              -print
            exit 1
          fi

      - name: Populate revo-root
        shell: bash
        run: |
          ROOT="src-tauri/resources/revo-root"

          mkdir -p "$ROOT"

          if [ -d "$RUNNER_TEMP/obs-install/data" ]; then
            rsync -a \
              "$RUNNER_TEMP/obs-install/data/" \
              "$ROOT/data/"
          fi

          if [ -d "$RUNNER_TEMP/obs-install/lib" ]; then
            rsync -a \
              "$RUNNER_TEMP/obs-install/lib/" \
              "$ROOT/lib/"
          fi

          if [ -d "$RUNNER_TEMP/obs-install/share" ]; then
            rsync -a \
              "$RUNNER_TEMP/obs-install/share/" \
              "$ROOT/share/"
          fi

          if [ -d "$RUNNER_TEMP/obs-install/bin" ]; then
            rsync -a \
              "$RUNNER_TEMP/obs-install/bin/" \
              "$ROOT/bin/"
          fi

          find "$ROOT" -maxdepth 4 -type f -print | sort | head -300

      - name: Verify macOS runtime
        shell: bash
        run: |
          ROOT="src-tauri/resources/revo-root"

          if find "$ROOT" \
            -type f \
            \( -name "*.dll" -o -name "*.exe" \) \
            -print -quit | grep -q .; then
            echo "ERROR: Windows binaries leaked into macOS revo-root"
            find "$ROOT" \
              -type f \
              \( -name "*.dll" -o -name "*.exe" \) \
              -print
            exit 1
          fi

          DYLIBS=$(find "$ROOT" -type f -name "*.dylib" | wc -l | tr -d ' ')

          if [ "$DYLIBS" -eq 0 ]; then
            echo "ERROR: No macOS dylibs found in revo-root"
            exit 1
          fi

          echo "macOS dylibs: $DYLIBS"

      - name: Build macOS DMG
        run: |
          pnpm tauri build \
            --bundles dmg \
            --target "${{ matrix.target }}" \
            -- \
            --no-default-features

      - name: Verify macOS DMG
        shell: bash
        run: |
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"

          if ! compgen -G "$DMG_DIR/*.dmg" > /dev/null; then
            echo "DMG not found: $DMG_DIR"
            exit 1
          fi

          ls -lh "$DMG_DIR"/*.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg


  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - windows
      - macos

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64

      - name: Show release files
        run: |
          find release -type f -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*.msi
            release/windows/**/*.zip
            release/macos-arm64/**/*.dmg
            release/macos-x64/**/*.dmg
          generate_release_notes: true