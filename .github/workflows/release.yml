name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PNPM_VERSION: 10
  NODE_VERSION: 24
  OBS_VERSION: 32.1.2
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable CEF for CI build
        shell: pwsh
        run: |
          $path = "src-tauri/Cargo.toml"
          $content = Get-Content $path -Raw

          $content = $content.Replace(
            'cef = ["dep:revo-cef"]',
            'cef = []'
          )

          $content = $content.Replace(
            'revo-cef = { path = "../../modules/revo-cef", optional = true }',
            ''
          )

          Set-Content -Path $path -Value $content -NoNewline

          Write-Host "CEF disabled for CI"

      - name: Prepare revo-root
        shell: pwsh
        run: |
          Remove-Item "src-tauri/resources/revo-root" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "src-tauri/resources/revo-root" | Out-Null

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Verify libobs-bootstrapper
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\.cargo\git\checkouts"

          $bootstrapper = Get-ChildItem $root -Recurse -Filter Cargo.toml |
            Where-Object {
              $_.FullName -like "*\7e76c91\libobs-bootstrapper\Cargo.toml"
            } |
            Select-Object -First 1

          if (-not $bootstrapper) {
            throw "libobs-bootstrapper Cargo.toml not found"
          }

          $dir = Split-Path $bootstrapper.FullName
          $cargo = Get-Content $bootstrapper.FullName -Raw

          Write-Host "Using bootstrapper: $dir"

          if ($cargo -notmatch 'default\s*=\s*\["install_dummy_dll"\]') {
            throw "libobs-bootstrapper install_dummy_dll is not enabled by default"
          }

          $dummy = Join-Path $dir "assets\obs-dummy.dll"

          if (-not (Test-Path $dummy)) {
            throw "Dummy DLL not found: $dummy"
          }

          Write-Host "install_dummy_dll: enabled"
          Write-Host "dummy DLL: $dummy"

      - name: Install cargo-obs-build
        run: cargo install cargo-obs-build --locked

      - name: Bootstrap OBS
        working-directory: src-tauri
        shell: pwsh
        run: cargo obs-build build --out-dir target/release

      - name: Verify Windows OBS runtime
        shell: pwsh
        run: |
          $out = "src-tauri/target/release"
          $obs = "$out/obs.dll"

          if (-not (Test-Path $obs)) {
            throw "OBS runtime missing: $obs"
          }

          $size = (Get-Item $obs).Length

          Write-Host "obs.dll size: $size bytes"

          if ($size -lt 500000) {
            throw "obs.dll is unexpectedly small"
          }

          Write-Host "Windows OBS runtime looks valid"

      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi -- --no-default-features

      - name: Verify Windows MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            "src-tauri/target/release/bundle/msi" `
            -Filter "*.msi" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $msi) {
            throw "MSI was not produced"
          }

          $msi | ForEach-Object {
            Write-Host "MSI: $($_.FullName)"
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $zip = "src-tauri/target/release/bundle/revo-ui-windows-x64.zip"
          $exe = "src-tauri/target/release/revo-ui.exe"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }

          Compress-Archive `
            -Path $exe `
            -DestinationPath $zip

          Write-Host "Created: $zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/revo-ui-windows-x64.zip


  # ============================================================
  # macOS
  # ============================================================

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            cmake_arch: arm64

          - arch: x64
            target: x86_64-apple-darwin
            cmake_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
          rustc --version
          cmake --version
          xcodebuild -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------
      # SIMDe
      # ----------------------------------------------------------

      - name: Install SIMDe
        run: |
          brew install simde

          echo "CPATH=$(brew --prefix simde)/include:${CPATH:-}" >> "$GITHUB_ENV"
          echo "C_INCLUDE_PATH=$(brew --prefix simde)/include:${C_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$(brew --prefix simde)/include:${CPLUS_INCLUDE_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify SIMDe
        run: |
          SIMDE="$(brew --prefix simde)"
          HEADER="$SIMDE/include/simde/x86/sse2.h"

          if [ ! -f "$HEADER" ]; then
            echo "SIMDe header not found: $HEADER"
            exit 1
          fi

          echo "SIMDe header found:"
          ls -l "$HEADER"

      # ----------------------------------------------------------
      # CEF
      # ----------------------------------------------------------

      - name: Disable CEF for CI build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/Cargo.toml")
          text = path.read_text()

          text = text.replace(
              'cef = ["dep:revo-cef"]',
              'cef = []'
          )

          text = text.replace(
              'revo-cef = { path = "../../modules/revo-cef", optional = true }',
              ''
          )

          path.write_text(text)

          print("CEF disabled for CI")
          PY

      # ----------------------------------------------------------
      # Rust dependencies
      # ----------------------------------------------------------

      - name: Fetch Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      # ----------------------------------------------------------
      # libobs bindgen
      # ----------------------------------------------------------

      - name: Patch libobs bindgen for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".cargo/git/checkouts"

          matches = list(
              root.glob("libobs-rs-*/7e76c91/libobs/build.rs")
          )

          if not matches:
              raise SystemExit("libobs build.rs not found")

          path = matches[0]
          text = path.read_text()

          print(f"Using libobs build.rs: {path}")

          if "builder = builder.layout_tests(false);" in text:
              print("libobs bindgen patch already present")
              raise SystemExit(0)

          needle = '        .clang_arg(format!("-I{}", "headers/obs"));'

          if needle not in text:
              raise SystemExit(
                  "Expected clang_arg line not found in libobs/build.rs"
              )

          replacement = (
              needle
              + "\n\n"
              + '    #[cfg(target_os = "macos")]'
              + "\n"
              + "    {"
              + "\n"
              + "        builder = builder.layout_tests(false);"
              + "\n"
              + "    }"
          )

          path.write_text(text.replace(needle, replacement, 1))

          print("libobs bindgen macOS patch applied")
          PY

      # ----------------------------------------------------------
      # libobs-wrapper
      # ----------------------------------------------------------

      - name: Patch libobs-wrapper for macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".cargo/git/checkouts"

          matches = list(
              root.glob("libobs-rs-*/7e76c91/libobs-wrapper/src")
          )

          if not matches:
              raise SystemExit("libobs-wrapper source not found")

          src = matches[0]
          other = src / "utils/initialization/other.rs"
          runtime = src / "runtime.rs"

          if not other.exists():
              raise SystemExit(f"Missing file: {other}")

          if not runtime.exists():
              raise SystemExit(f"Missing file: {runtime}")

          print(f"Using libobs-wrapper source: {src}")

          # ------------------------------------------------------
          # Rc must also exist on macOS because the non-Linux
          # PlatformSpecificGuard uses the same module.
          # ------------------------------------------------------

          lines = other.read_text().splitlines()

          for i, line in enumerate(lines):
              if line.strip() == "use std::rc::Rc;":
                  if i > 0 and lines[i - 1].strip() == '#[cfg(target_os = "linux")]':
                      del lines[i - 1]
                  break

          # ------------------------------------------------------
          # Make PlatformSpecificGuard Linux-only and provide
          # an empty guard for non-Linux targets.
          # ------------------------------------------------------

          lines = other.read_text().splitlines()

          struct_index = None

          for i, line in enumerate(lines):
              if line.strip() == "pub(crate) struct PlatformSpecificGuard {":
                  struct_index = i
                  break

          if struct_index is None:
              raise SystemExit(
                  "PlatformSpecificGuard struct not found"
              )

          if struct_index == 0 or lines[struct_index - 1].strip() != '#[cfg(target_os = "linux")]':
              derive_index = struct_index

              if (
                  derive_index > 0
                  and lines[derive_index - 1].strip() == "#[derive(Debug)]"
              ):
                  derive_index -= 1

              lines.insert(
                  derive_index,
                  '#[cfg(target_os = "linux")]'
              )

          # Recalculate struct index after possible insertion.
          struct_index = None

          for i, line in enumerate(lines):
              if line.strip() == "pub(crate) struct PlatformSpecificGuard {":
                  struct_index = i
                  break

          if struct_index is None:
              raise SystemExit(
                  "PlatformSpecificGuard struct disappeared"
              )

          depth = 0
          end_index = None
          started = False

          for i in range(struct_index, len(lines)):
              line = lines[i]

              if "{" in line:
                  depth += line.count("{")
                  started = True

              if "}" in line and started:
                  depth -= line.count("}")

                  if depth == 0:
                      end_index = i
                      break

          if end_index is None:
              raise SystemExit(
                  "Could not find end of PlatformSpecificGuard"
              )

          stub_exists = any(
              line.strip() == "pub(crate) struct PlatformSpecificGuard;"
              for line in lines
          )

          if not stub_exists:
              stub = [
                  "",
                  '#[cfg(not(target_os = "linux"))]',
                  "#[derive(Debug)]",
                  "pub(crate) struct PlatformSpecificGuard;",
              ]

              lines[end_index + 1:end_index + 1] = stub

          # ------------------------------------------------------
          # Drop implementation is Linux-only.
          # ------------------------------------------------------

          for i, line in enumerate(lines):
              if line.strip() == "impl Drop for PlatformSpecificGuard {":
                  if i == 0 or lines[i - 1].strip() != '#[cfg(target_os = "linux")]':
                      lines.insert(
                          i,
                          '#[cfg(target_os = "linux")]'
                      )
                  break

          other.write_text("\n".join(lines) + "\n")

          # ------------------------------------------------------
          # macOS does not have the Linux nix_display argument.
          # ------------------------------------------------------

          runtime_text = runtime.read_text()

          old = "platform_specific_setup(info.nix_display.clone())?"
          new = "platform_specific_setup()?"

          if old in runtime_text:
              runtime_text = runtime_text.replace(old, new, 1)
              runtime.write_text(runtime_text)

          print("libobs-wrapper macOS patch applied")
          PY

      # ----------------------------------------------------------
      # Verify Rust patches
      # ----------------------------------------------------------

      - name: Verify libobs patches
        shell: bash
        run: |
          echo "=== libobs bindgen ==="

          BUILD_RS=$(find "$HOME/.cargo/git/checkouts" \
            -path "*/7e76c91/libobs/build.rs" \
            -print -quit)

          if [ -z "$BUILD_RS" ]; then
            echo "libobs build.rs not found"
            exit 1
          fi

          grep -n -C 4 "layout_tests" "$BUILD_RS"

          echo
          echo "=== libobs-wrapper ==="

          WRAPPER_SRC=$(find "$HOME/.cargo/git/checkouts" \
            -path "*/7e76c91/libobs-wrapper/src" \
            -type d \
            -print -quit)

          if [ -z "$WRAPPER_SRC" ]; then
            echo "libobs-wrapper source not found"
            exit 1
          fi

          grep -n -C 3 "PlatformSpecificGuard" \
            "$WRAPPER_SRC/utils/initialization/other.rs"

          echo
          grep -n -C 4 "platform_specific_setup" \
            "$WRAPPER_SRC/runtime.rs" || true

      # ----------------------------------------------------------
      # Runtime resources
      # ----------------------------------------------------------

      - name: Prepare revo-root
        shell: bash
        run: |
          rm -rf src-tauri/resources/revo-root
          mkdir -p src-tauri/resources/revo-root

      # ----------------------------------------------------------
      # OBS Studio
      # ----------------------------------------------------------

      - name: Checkout OBS Studio
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/obs-studio"

          git clone \
            --depth 1 \
            --branch "${OBS_VERSION}" \
            --recursive \
            https://github.com/obsproject/obs-studio.git \
            "$RUNNER_TEMP/obs-studio"

          git -C "$RUNNER_TEMP/obs-studio" log -1 --oneline

      - name: Patch OBS libobs-metal Swift
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = (
              Path.home()
              / "dummy"
          )

          obs = Path("${RUNNER_TEMP}/obs-studio")

          # GitHub Actions does not expand shell variables inside
          # a quoted Python heredoc, so use the environment instead.
          import os

          obs = Path(os.environ["RUNNER_TEMP"]) / "obs-studio"
          path = obs / "libobs-metal/CMakeLists.txt"

          if not path.exists():
              raise SystemExit(
                  f"Missing OBS Metal CMakeLists: {path}"
              )

          text = path.read_text()

          if "enable_language(Swift)" in text:
              print("OBS already enables Swift")
          else:
              path.write_text(
                  "enable_language(Swift)\n\n" + text
              )
              print("Added enable_language(Swift)")

          print()
          print("=== libobs-metal/CMakeLists.txt ===")

          for i, line in enumerate(path.read_text().splitlines()[:12], 1):
              print(f"{i}: {line}")
          PY

      - name: Verify OBS source
        shell: bash
        run: |
          OBS_SRC="$RUNNER_TEMP/obs-studio"

          test -f "$OBS_SRC/CMakePresets.json"
          test -f "$OBS_SRC/libobs-metal/CMakeLists.txt"

          echo "OBS source:"
          git -C "$OBS_SRC" log -1 --oneline

          echo
          echo "OBS Metal:"
          head -n 8 "$OBS_SRC/libobs-metal/CMakeLists.txt"

      # ----------------------------------------------------------
      # OBS configure
      #
      # Use OBS' own macOS preset. The preset supplies the official
      # macOS dependency configuration and Xcode generator.
      # ----------------------------------------------------------

      - name: Configure OBS Studio
        shell: bash
        run: |
          OBS_SRC="$RUNNER_TEMP/obs-studio"
          OBS_BUILD="$RUNNER_TEMP/obs-build"

          rm -rf "$OBS_BUILD"

          cmake \
            -S "$OBS_SRC" \
            -B "$OBS_BUILD" \
            --preset macos \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_BROWSER=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_FRONTEND=OFF

      # ----------------------------------------------------------
      # OBS build
      # ----------------------------------------------------------

      - name: Build OBS Studio
        shell: bash
        run: |
          cmake \
            --build "$RUNNER_TEMP/obs-build" \
            --config RelWithDebInfo \
            --parallel "$(sysctl -n hw.ncpu)"

      # ----------------------------------------------------------
      # OBS install
      # ----------------------------------------------------------

      - name: Install OBS Studio
        shell: bash
        run: |
          OBS_INSTALL="$RUNNER_TEMP/obs-install"

          rm -rf "$OBS_INSTALL"
          mkdir -p "$OBS_INSTALL"

          cmake \
            --install "$RUNNER_TEMP/obs-build" \
            --config RelWithDebInfo \
            --prefix "$OBS_INSTALL"

      # ----------------------------------------------------------
      # Inspect OBS
      # ----------------------------------------------------------

      - name: Inspect macOS OBS build
        shell: bash
        run: |
          echo "=== OBS dynamic libraries ==="

          find "$RUNNER_TEMP/obs-install" \
            -type f \
            \( \
              -name "*.dylib" \
              -o -name "*.so" \
            \) \
            -print | sort | head -300

          echo
          echo "=== OBS frameworks ==="

          find "$RUNNER_TEMP/obs-install" \
            -type d \
            -name "*.framework" \
            -print | sort | head -100

          echo
          echo "=== OBS files ==="

          find "$RUNNER_TEMP/obs-install" \
            -type f \
            -print | sort | head -400

      - name: Reject Windows OBS binaries
        shell: bash
        run: |
          WINDOWS_BINARIES=$(find "$RUNNER_TEMP/obs-install" \
            -type f \
            \( \
              -name "*.dll" \
              -o -name "*.exe" \
              -o -name "*.pdb" \
            \) \
            -print)

          if [ -n "$WINDOWS_BINARIES" ]; then
            echo "ERROR: Windows binaries found in macOS OBS installation:"
            echo "$WINDOWS_BINARIES"
            exit 1
          fi

          echo "No Windows binaries found"

      # ----------------------------------------------------------
      # Prepare RevoStream runtime layout
      # ----------------------------------------------------------

      - name: Populate revo-root
        shell: bash
        run: |
          ROOT="src-tauri/resources/revo-root"

          mkdir -p "$ROOT"

          # RevoStream application data.
          if [ -d "data" ]; then
            rsync -a \
              "data/" \
              "$ROOT/data/"
          fi

          # OBS runtime.
          mkdir -p "$ROOT/core"

          if [ -d "$RUNNER_TEMP/obs-install/lib" ]; then
            rsync -a \
              "$RUNNER_TEMP/obs-install/lib/" \
              "$ROOT/core/lib/"
          fi

          if [ -d "$RUNNER_TEMP/obs-install/share" ]; then
            rsync -a \
              "$RUNNER_TEMP/obs-install/share/" \
              "$ROOT/core/share/"
          fi

          if [ -d "$RUNNER_TEMP/obs-install/bin" ]; then
            rsync -a \
              "$RUNNER_TEMP/obs-install/bin/" \
              "$ROOT/core/bin/"
          fi

          echo
          echo "=== revo-root ==="

          find "$ROOT" \
            -maxdepth 5 \
            -type f \
            -print | sort | head -500

      - name: Verify macOS runtime
        shell: bash
        run: |
          ROOT="src-tauri/resources/revo-root"

          if [ ! -d "$ROOT/core/lib" ]; then
            echo "ERROR: core/lib does not exist"
            exit 1
          fi

          DYLIB_COUNT=$(find "$ROOT/core/lib" \
            -type f \
            -name "*.dylib" \
            | wc -l \
            | tr -d ' ')

          if [ "$DYLIB_COUNT" -eq 0 ]; then
            echo "ERROR: no macOS dylibs found"
            exit 1
          fi

          echo "macOS dylibs: $DYLIB_COUNT"

          WINDOWS_BINARIES=$(find "$ROOT" \
            -type f \
            \( \
              -name "*.dll" \
              -o -name "*.exe" \
              -o -name "*.pdb" \
            \) \
            -print)

          if [ -n "$WINDOWS_BINARIES" ]; then
            echo "ERROR: Windows binaries leaked into macOS runtime:"
            echo "$WINDOWS_BINARIES"
            exit 1
          fi

          echo "macOS runtime layout looks valid"

      # ----------------------------------------------------------
      # Tauri
      # ----------------------------------------------------------

      - name: Build macOS DMG
        run: |
          pnpm tauri build \
            --bundles dmg \
            --target "${{ matrix.target }}" \
            -- \
            --no-default-features

      - name: Verify macOS DMG
        shell: bash
        run: |
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"

          if ! compgen -G "$DMG_DIR/*.dmg" > /dev/null; then
            echo "ERROR: DMG was not produced"
            echo "Expected directory: $DMG_DIR"
            exit 1
          fi

          echo "macOS DMG:"
          ls -lh "$DMG_DIR"/*.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg


  # ============================================================
  # RELEASE
  # ============================================================

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - windows
      - macos

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release/windows

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release/macos-arm64

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: release/macos-x64

      - name: Show release files
        run: |
          find release \
            -type f \
            -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*.msi
            release/windows/**/*.zip
            release/macos-arm64/**/*.dmg
            release/macos-x64/**/*.dmg
          generate_release_notes: true
